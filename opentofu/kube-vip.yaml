machine:
  pods:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: kube-vip
        namespace: kube-system
      spec:
        containers:
          - name: kube-vip
            image: ghcr.io/kube-vip/kube-vip:v0.6.4
            args:
              - manager
              - --start-as-leader
              - --interface=eth0
              - --vip=192.168.10.20
              - --controlplane
              - --services
              - --arp
              - --leader-election
            env:
              - name: vip_arp
                value: "true"
              - name: port
                value: "6443"
              - name: vip_interface
                value: "eth0"
              - name: vip_cidr
                value: "32"
              - name: cp_enable
                value: "true"
              - name: cp_namespace
                value: "kube-system"
              - name: vip_leaderelection
                value: "true"
              - name: vip_leaseduration
                value: "5"
              - name: vip_renewdeadline
                value: "3"
              - name: vip_retryperiod
                value: "1"
              - name: address
                value: "192.168.10.20"
              - name: prometheus_server
                value: ":2112"
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
                  - NET_RAW
                  - SYS_TIME
            volumeMounts:
              - mountPath: /etc/kubernetes/admin.conf
                name: kubeconfig
        hostNetwork: true
        volumes:
          - hostPath:
              path: /etc/kubernetes/admin.conf
            name: kubeconfig
