---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wger-postgres-backup
  namespace: wger
spec:
  schedule: "0 2 * * *" # Daily at 2AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: postgres-backup
              image: postgres:latest
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wger-db-postgres-creds-1password
                      key: password
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: wger-db-postgres-creds-1password
                      key: username
                - name: POSTGRES_HOST
                  value: wger-database-rw.wger.svc.cluster.local
                - name: POSTGRES_DB
                  value: wger
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  
                  MAX_RETRIES=5
                  RETRY_DELAYS=(10 20 40 80 160)
                  
                  log_info() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] INFO: $*" >&2
                  }
                  
                  log_error() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ERROR: $*" >&2
                  }
                  
                  error_trap() {
                      local exit_code=$?
                      local line_number=$1
                      log_error "Wger backup failed at line $line_number with exit code $exit_code"
                      exit $exit_code
                  }
                  
                  trap 'error_trap $LINENO' ERR
                  
                  retry_with_backoff() {
                      local cmd="$1"
                      local attempt=1
                      
                      while [[ $attempt -le $MAX_RETRIES ]]; do
                          log_info "Attempt $attempt/$MAX_RETRIES: $cmd"
                          
                          if eval "$cmd"; then
                              log_info "Command succeeded on attempt $attempt"
                              return 0
                          else
                              local exit_code=$?
                              log_error "Command failed on attempt $attempt with exit code $exit_code"
                              
                              if [[ $attempt -eq $MAX_RETRIES ]]; then
                                  log_error "All $MAX_RETRIES attempts failed"
                                  return $exit_code
                              fi
                              
                              local delay=${RETRY_DELAYS[$((attempt-1))]}
                              log_info "Waiting $delay seconds before next attempt..."
                              sleep "$delay"
                              ((attempt++))
                          fi
                      done
                  }
                  
                  BACKUP_FILE="wger_postgres_backup_$(date +%Y%m%d_%H%M%S).sql.gz"
                  
                  log_info "🔄 Starting Wger PostgreSQL backup: $BACKUP_FILE"
                  
                  # Validate environment variables
                  if [[ -z "${POSTGRES_HOST:-}" || -z "${POSTGRES_USER:-}" || -z "${POSTGRES_DB:-}" ]]; then
                      log_error "Missing required environment variables"
                      exit 1
                  fi
                  
                  # Test connection with retry
                  retry_with_backoff "pg_isready -h '$POSTGRES_HOST' -U '$POSTGRES_USER' -d '$POSTGRES_DB'"
                  
                  # Create backup with retry
                  retry_with_backoff "pg_dump -h '$POSTGRES_HOST' -U '$POSTGRES_USER' -d '$POSTGRES_DB' --verbose --no-owner --no-privileges | gzip > /mnt/backup/$BACKUP_FILE"
                  
                  # Validate backup file
                  if [[ ! -f "/mnt/backup/$BACKUP_FILE" ]]; then
                      log_error "Backup file not created: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  if [[ ! -s "/mnt/backup/$BACKUP_FILE" ]]; then
                      log_error "Backup file is empty: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  # Test compressed file integrity
                  if ! gzip -t "/mnt/backup/$BACKUP_FILE"; then
                      log_error "Backup file is corrupted: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  # Log success with file size
                  BACKUP_SIZE=$(du -h "/mnt/backup/$BACKUP_FILE" | cut -f1)
                  log_info "✅ PostgreSQL backup completed successfully: $BACKUP_FILE ($BACKUP_SIZE)"
                  
                  # Signal the next container
                  touch /mnt/backup/.postgres_done
              volumeMounts:
                - name: backup-storage
                  mountPath: /mnt/backup
            - name: redis-backup
              image: redis:latest
              env:
                - name: REDIS_HOST
                  value: wger-redis.wger.svc.cluster.local
                - name: REDIS_PORT
                  value: "6379"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  
                  log_info() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] INFO: $*" >&2
                  }
                  
                  log_error() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ERROR: $*" >&2
                  }
                  
                  BACKUP_FILE="wger_redis_backup_$(date +%Y%m%d_%H%M%S).rdb"
                  
                  log_info "🔄 Starting Wger Redis backup: $BACKUP_FILE"
                  
                  # Test Redis connection
                  if ! redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" ping; then
                      log_error "Cannot connect to Redis"
                      exit 1
                  fi
                  
                  # Create Redis backup
                  redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" --rdb "/mnt/backup/$BACKUP_FILE"
                  
                  # Validate backup file
                  if [[ ! -f "/mnt/backup/$BACKUP_FILE" ]]; then
                      log_error "Redis backup file not created: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  if [[ ! -s "/mnt/backup/$BACKUP_FILE" ]]; then
                      log_error "Redis backup file is empty: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  # Compress the RDB file
                  gzip "/mnt/backup/$BACKUP_FILE"
                  
                  # Log success with file size
                  BACKUP_SIZE=$(du -h "/mnt/backup/${BACKUP_FILE}.gz" | cut -f1)
                  log_info "✅ Redis backup completed successfully: ${BACKUP_FILE}.gz ($BACKUP_SIZE)"
                  
                  # Signal the next container
                  touch /mnt/backup/.redis_done
              volumeMounts:
                - name: backup-storage
                  mountPath: /mnt/backup
            - name: b2-uploader
              image: backblazeit/b2:latest
              env:
                - name: B2_APPLICATION_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: keyID
                - name: B2_APPLICATION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: applicationKey
                - name: B2_BUCKET_NAME
                  value: "cloud-homelab-backups"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  
                  MAX_RETRIES=5
                  RETRY_DELAYS=(10 20 40 80 160)
                  
                  log_info() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] INFO: $*" >&2
                  }
                  
                  log_error() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ERROR: $*" >&2
                  }
                  
                  retry_with_backoff() {
                      local cmd="$1"
                      local attempt=1
                      
                      while [[ $attempt -le $MAX_RETRIES ]]; do
                          log_info "Attempt $attempt/$MAX_RETRIES: $cmd"
                          
                          if eval "$cmd"; then
                              log_info "Command succeeded on attempt $attempt"
                              return 0
                          else
                              local exit_code=$?
                              log_error "Command failed on attempt $attempt with exit code $exit_code"
                              
                              if [[ $attempt -eq $MAX_RETRIES ]]; then
                                  log_error "All $MAX_RETRIES attempts failed"
                                  return $exit_code
                              fi
                              
                              local delay=${RETRY_DELAYS[$((attempt-1))]}
                              log_info "Waiting $delay seconds before next attempt..."
                              sleep "$delay"
                              ((attempt++))
                          fi
                      done
                  }
                  
                  log_info "🔄 Starting B2 upload process..."
                  
                  # Validate environment variables
                  if [[ -z "${B2_APPLICATION_KEY_ID:-}" || -z "${B2_APPLICATION_KEY:-}" || -z "${B2_BUCKET_NAME:-}" ]]; then
                      log_error "Missing required B2 environment variables"
                      exit 1
                  fi
                  
                  # Wait for both backups to complete
                  timeout=1800  # 30 minutes
                  elapsed=0
                  while [[ ! -f /mnt/backup/.postgres_done ]] || [[ ! -f /mnt/backup/.redis_done ]]; do
                      if [[ $elapsed -ge $timeout ]]; then
                          log_error "Timeout waiting for backup completion"
                          exit 1
                      fi
                      
                      postgres_status="❌"
                      redis_status="❌"
                      [[ -f /mnt/backup/.postgres_done ]] && postgres_status="✅"
                      [[ -f /mnt/backup/.redis_done ]] && redis_status="✅"
                      
                      log_info "Waiting for backup completion... PostgreSQL: $postgres_status Redis: $redis_status (${elapsed}s elapsed)"
                      sleep 10
                      ((elapsed+=10))
                  done
                  
                  # Upload PostgreSQL backup
                  POSTGRES_BACKUP=$(ls /mnt/backup/wger_postgres_backup_*.sql.gz | head -1 2>/dev/null || true)
                  if [[ -n "$POSTGRES_BACKUP" ]] && [[ -f "$POSTGRES_BACKUP" ]] && [[ -s "$POSTGRES_BACKUP" ]]; then
                      UPLOAD_PATH="wger/postgres/$(basename "$POSTGRES_BACKUP")"
                      log_info "Uploading PostgreSQL backup to B2: $UPLOAD_PATH"
                      retry_with_backoff "b2v4 file upload '$B2_BUCKET_NAME' '$POSTGRES_BACKUP' '$UPLOAD_PATH'"
                  else
                      log_error "PostgreSQL backup file not found or empty"
                      exit 1
                  fi
                  
                  # Upload Redis backup
                  REDIS_BACKUP=$(ls /mnt/backup/wger_redis_backup_*.rdb.gz | head -1 2>/dev/null || true)
                  if [[ -n "$REDIS_BACKUP" ]] && [[ -f "$REDIS_BACKUP" ]] && [[ -s "$REDIS_BACKUP" ]]; then
                      UPLOAD_PATH="wger/redis/$(basename "$REDIS_BACKUP")"
                      log_info "Uploading Redis backup to B2: $UPLOAD_PATH"
                      retry_with_backoff "b2v4 file upload '$B2_BUCKET_NAME' '$REDIS_BACKUP' '$UPLOAD_PATH'"
                  else
                      log_error "Redis backup file not found or empty"
                      exit 1
                  fi
                  
                  log_info "✅ B2 upload completed successfully for both PostgreSQL and Redis backups"
              volumeMounts:
                - name: backup-storage
                  mountPath: /mnt/backup
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wger-cleanup
  namespace: wger
spec:
  schedule: "0 4 1 * *" # Monthly cleanup on 1st at 4AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: b2-cleanup
              image: backblazeit/b2:latest
              env:
                - name: B2_APPLICATION_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: keyID
                - name: B2_APPLICATION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: applicationKey
                - name: B2_BUCKET_NAME
                  value: "cloud-homelab-backups"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  
                  log_info() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] INFO: $*" >&2
                  }
                  
                  log_info "🔄 Starting Wger backup cleanup (keeping last 30 days)..."
                  
                  # Clean PostgreSQL backups
                  CUTOFF_DATE=$(date -d '30 days ago' +%Y%m%d)
                  
                  # Clean PostgreSQL backups
                  b2v4 file ls "$B2_BUCKET_NAME" wger/postgres/ | while read -r file_info; do
                      filename=$(echo "$file_info" | awk '{print $2}')
                      
                      if [[ $filename =~ wger_postgres_backup_([0-9]{8})_[0-9]{6}\.sql\.gz$ ]]; then
                          file_date=${BASH_REMATCH[1]}
                          
                          if [[ $file_date < $CUTOFF_DATE ]]; then
                              log_info "Deleting old PostgreSQL backup: $filename (date: $file_date)"
                              file_id=$(echo "$file_info" | awk '{print $1}')
                              b2v4 file delete "$file_id" "$filename"
                          fi
                      fi
                  done
                  
                  # Clean Redis backups
                  b2v4 file ls "$B2_BUCKET_NAME" wger/redis/ | while read -r file_info; do
                      filename=$(echo "$file_info" | awk '{print $2}')
                      
                      if [[ $filename =~ wger_redis_backup_([0-9]{8})_[0-9]{6}\.rdb\.gz$ ]]; then
                          file_date=${BASH_REMATCH[1]}
                          
                          if [[ $file_date < $CUTOFF_DATE ]]; then
                              log_info "Deleting old Redis backup: $filename (date: $file_date)"
                              file_id=$(echo "$file_info" | awk '{print $1}')
                              b2v4 file delete "$file_id" "$filename"
                          fi
                      fi
                  done
                  
                  log_info "✅ Wger backup cleanup completed"
          restartPolicy: OnFailure