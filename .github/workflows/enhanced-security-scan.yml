name: 🔒 Enhanced Security Scanning (Azure DevOps Migration)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - 'apps/**'
      - 'charts/**'
      - 'pulumi/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - 'apps/**'
      - 'charts/**'
      - 'pulumi/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # Run nightly security scans at 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      scan_scope:
        description: 'Scope of security scan'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - terraform-only
          - kubernetes-only
          - containers-only

      fail_on_high:
        description: 'Fail on high severity issues'
        required: false
        default: false
        type: boolean

      upload_sarif:
        description: 'Upload SARIF to GitHub Code Scanning'
        required: false
        default: true
        type: boolean

env:
  TERRAFORM_VERSION: "1.8.0"
  CHECKOV_VERSION: "3.1.34"
  TFSEC_VERSION: "1.28.4"
  TERRASCAN_VERSION: "1.18.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel security scans

jobs:
  # Pre-scan validation and change detection
  change-detection:
    name: 🔍 Change Detection & Validation
    runs-on: ubuntu-latest
    outputs:
      terraform-changed: ${{ steps.changes.outputs.terraform }}
      kubernetes-changed: ${{ steps.changes.outputs.kubernetes }}
      containers-changed: ${{ steps.changes.outputs.containers }}
      security-changed: ${{ steps.changes.outputs.security }}
      scan-terraform: ${{ steps.determine-scope.outputs.scan-terraform }}
      scan-kubernetes: ${{ steps.determine-scope.outputs.scan-kubernetes }}
      scan-containers: ${{ steps.determine-scope.outputs.scan-containers }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '**/*.tf'
              - '**/*.tfvars'
            kubernetes:
              - 'apps/**/*.yaml'
              - 'apps/**/*.yml'
              - 'charts/**'
            containers:
              - '**/Dockerfile'
