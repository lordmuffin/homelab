apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-servers-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: secrets
  source:
    repoURL: https://gitea.home.andrewpjackson.com/homelab/homelab.git
    targetRevision: HEAD
    path: apps/secrets/mcp-servers
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-servers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3