# Actual Budget PVC - Translated from apps/data/storage/base/actual.yaml
# Storage for Actual Budget application data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-storage
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sata
  resources:
    requests:
      storage: 5Gi