# Tandoor Recipe Storage PVCs - Translated from apps/data/storage/base/tandoor.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recipes-static
  namespace: tandoor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sata
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recipes-media
  namespace: tandoor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sata
  resources:
    requests:
      storage: 20Gi