# JupyterLab Storage PVC - Translated from apps/data/storage/base/jupyterlab.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterlab-storage
  namespace: mlops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: freenas-iscsi-csi
  resources:
    requests:
      storage: 30Gi