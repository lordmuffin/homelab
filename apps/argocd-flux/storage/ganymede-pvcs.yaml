# Ganymede Storage PVCs - Translated from apps/data/storage/base/ganymede.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ganymede-storage
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: freenas-iscsi-csi
  resources:
    requests:
      storage: 15Gi
---
