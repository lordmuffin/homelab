# Bazarr Subtitle Manager Application converted from ArgoCD to FluxCD
# Original: base/services/media/bazarr.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: bazarr
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/services/media/bazarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-main
    namespace: flux-system
  targetNamespace: media
  
  # Health checks
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: bazarr
      namespace: media
  
  # Converted from ArgoCD sync policy
  retryInterval: 2m0s
  timeout: 15m0s
  wait: true