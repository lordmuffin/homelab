# RSSHub Application converted from ArgoCD to FluxCD
# Original: base/services/rss-hub.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: rss-hub
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/services/rss-hub
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-main
    namespace: flux-system
  targetNamespace: services
  
  # Health checks
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: rss-hub
      namespace: services
  
  # Converted from ArgoCD sync policy
  retryInterval: 2m0s
  timeout: 15m0s
  wait: true