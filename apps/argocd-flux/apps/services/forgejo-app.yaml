# Forgejo Application converted from ArgoCD to FluxCD
# Original: base/services/forgejo.yaml
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: forgejo
  namespace: flux-system
spec:
  interval: 10m0s
  chart:
    spec:
      chart: forgejo
      version: 'v8.0.0'
      sourceRef:
        kind: OCIRepository
        name: forgejo-helm
        namespace: flux-system
      interval: 5m0s
  
  targetNamespace: forgejo
  
  # Converted Helm values from original ArgoCD Application
  values:
    checkDeprecation: true
    replicaCount: 1
    clusterDomain: cluster.local
    extraVolumes:
      - name: gitea-themes
        configMap:
          name: gitea-themes
          items:
          - key: theme-catppuccin-mocha-blue.css
            path: theme-catppuccin-mocha-blue.css
    extraVolumeMounts:
      - name: gitea-themes
        readOnly: true
        mountPath: "/data/gitea/public/css"
    strategy:
      type: "Recreate"
    gitea:
      additionalConfigFromEnvs:
        - name: GITEA__DATABASE__HOST
          value: gitea-database-rw.gitea.svc.cluster.local:5432
        - name: GITEA__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: gitea-db-postgres-creds-1password
              key: username
        - name: GITEA__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-db-postgres-creds-1password
              key: password
      additionalConfigSources:
        - configMap:
            name: gitea-app-ini
      config:
        APP_NAME: "Gitea"
        server:
          SSH_PORT: 22
      admin:
        existingSecret: gitea-admin-creds-1password
      livenessProbe:
        enabled: true
        failureThreshold: 10
        initialDelaySeconds: 200
        periodSeconds: 10
        successThreshold: 1
        tcpSocket:
          port: http
        timeoutSeconds: 1
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      readinessProbe:
        enabled: true
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        tcpSocket:
          port: http
        timeoutSeconds: 1
      ssh:
        logLevel: INFO
      startupProbe:
        enabled: true
        failureThreshold: 10
        initialDelaySeconds: 60
        periodSeconds: 10
        successThreshold: 1
        tcpSocket:
          port: http
        timeoutSeconds: 1
    image:
      pullPolicy: Always
      repository: gitea/gitea
      rootless: false
    ingress:
      enabled: false
    initContainers:
      resources:
        limits:
          cpu: 350m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
    redis-cluster:
      enabled: false
      usePassword: false
    persistence:
      create: false
      mount: true
      enabled: true
      claimName: gitea-shared-storage
    podSecurityContext:
      fsGroup: 1000
    postgresql-ha:
      enabled: false
    postgresql:
      enabled: false
    resources:
      limits:
        cpu: 750m
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi
    service:
      http:
        port: 3000
        type: ClusterIP
      ssh:
        port: 22
        type: ClusterIP
    signing:
      enabled: false
      gpgHome: /data/git/.gnupg
    deployment:
      terminationGracePeriodSeconds: 60
      enabled: true
  
  # Retry configuration converted from ArgoCD
  timeout: 60m0s
  upgrade:
    remediation:
      retries: 10
      remediateLastFailure: true
  rollback:
    timeout: 60m0s