apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespaces (created first)
  - namespaces/
  
  # RBAC Policies (converted from ArgoCD AppProjects)
  - rbac/
  
  # Git and Helm Sources
  - sources/git/
  - sources/helm/
  
  # Storage resources (deployed before applications)
  - storage/
  
  # Applications organized by category (enable gradually)
  - apps/core/
  - apps/networking/
  - apps/services/
  # Missing directories - add when ready:
  # - apps/monitoring/
  # - apps/data/
  # - apps/utilities/
  # - apps/secrets/
  # - apps/mlops/
  # - apps/matrix/
  # - apps/media/
  # - apps/arr/

# Apply common labels to all resources
commonLabels:
  app.kubernetes.io/managed-by: flux
  migration.source: argocd

# Common annotations for all resources  
commonAnnotations:
  fluxcd.io/migrated-from: argocd
  fluxcd.io/migration-date: "2024-12-09"