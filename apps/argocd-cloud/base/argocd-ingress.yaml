apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd # Assuming ArgoCD is in the 'argocd' namespace
  annotations:
    external-dns.alpha.kubernetes.io/hostname: argocd.lab.apj.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "120"
    cert-manager.io/cluster-issuer: letsencrypt-production
    acme.cert-manager.io/http01-edit-in-place: "true"
    kubernetes.io/ingress.class: traefik-external
  labels:
    app.kubernetes.io/name: argocd-server
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.lab.apj.dev`)
      kind: Rule
      middlewares:
        - name: traefik-forward-auth
          namespace: traefik # Assuming your forward-auth middleware is in the 'traefik' namespace
      services:
        - name: argocd-server # Standard ArgoCD service name
          port: 80 # Standard HTTP port for ArgoCD server
  tls:
    secretName: lab-apj-dev # Using the same wildcard certificate as kuma