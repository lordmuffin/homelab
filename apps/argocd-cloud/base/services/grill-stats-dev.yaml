apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grill-stats-dev
  annotations:
    argocd-image-updater.argoproj.io/image-list: grill-stats=lordmuffin/grill-stats:latest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: 'https://github.com/lordmuffin/homelab.git'
    path: apps/services/grill-stats/overlays/dev
    targetRevision: main
  destination:
    namespace: grill-stats-dev
    name: in-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ApplyOutOfSyncOnly=false
    - Prune=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 15m