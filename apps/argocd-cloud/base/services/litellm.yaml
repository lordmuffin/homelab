apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: 'https://github.com/lordmuffin/homelab.git' # Assuming your repo URL
    path: apps/services/litellm
    targetRevision: main # Or your development branch
  destination:
    namespace: services
    name: in-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
    - Validate=false
    - CreateNamespace=true # Ensure namespace exists or is created by ArgoCD if not 'services'
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ApplyOutOfSyncOnly=false
    - Prune=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 15m