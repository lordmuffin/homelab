apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasm
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: 'https://github.com/kasmtech/kasm-helm.git'
    path: kasm-single-zone
    targetRevision: release/1.17.0
    helm:
      values: |
        global:
          namespace: "kasm"
          clusterDomain: "cluster.local"
          ingressClassName: "traefik"
          hostname: "kasm.lab.apj.dev"
          altHostnames: []
          image:
            pullPolicy: IfNotPresent
            restartPolicy: Always
            pullSecrets: ""
          kasmPasswords:
            redisPassword: ""
            dbPassword: ""
            managerToken: ""
            serviceToken: ""
            adminPassword: ""
            userPassword: ""

        kasmCerts:
          ingress:
            name: "lab-apj-dev-tls"
            create: false
            cert: ""
            key: ""
          kasmProxy:
            name: "lab-apj-dev-tls"
            create: false
            cert: ""
            key: ""
          rdpGateway:
            name: "lab-apj-dev-tls"
            create: false
            cert: ""
            key: ""
          db:
            name: "kasm-db-cert"
            create: false
            cert: ""
            key: ""

        kasmApp:
          name: "kasm"
          zoneName: "default"
          applyHardening: true
          deploymentSize: "small"
          servicesToDeploy:
            kasmProxy:
              replicas: 1
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
                  cpu: 1000m
            kasmApi:
              replicas: 1
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
                  cpu: 1000m
            kasmManager:
              replicas: 1
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
                  cpu: 1000m
            db:
              storageClassName: ""
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
                  cpu: 1000m
            kasmGuac:
              replicas: 1
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
                  cpu: 1000m
            kasmShare:
              replicas: 1
              resources:
                requests:
                  memory: 512Mi
                  cpu: 250m
                limits:
                  memory: 1Gi
                  cpu: 500m
            rdpGateway:
              replicas: 1
              resources:
                requests:
                  memory: 512Mi
                  cpu: 250m
                limits:
                  memory: 1Gi
                  cpu: 500m
  destination:
    namespace: kasm
    name: in-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
    - Validate=false
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ApplyOutOfSyncOnly=false
    - Prune=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 15m