---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: labs-apj-dev
  namespace: cert-manager
spec:
  secretName: labs-apj-dev-tls
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "argocd, arr-stack, jellyfin, jellyseerr, prowlarr, qflood, radarr, redis-operator, monitoring, traefik"
  issuerRef:
    name: technitium-letsencrypt
    kind: ClusterIssuer
  commonName: "*.labs.apj.dev"
  dnsNames:
  - "labs.apj.dev"
  - "*.labs.apj.dev"