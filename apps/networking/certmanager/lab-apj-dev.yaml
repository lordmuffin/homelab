---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-apj-dev
  namespace: cert-manager
spec:
  secretName: lab-apj-dev-tls
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "argocd, arr-stack, jellyfin, jellyseerr, prowlarr, qflood, radarr, redis-operator, monitoring, traefik, services, tandoor, paperless, grill-stats"
  issuerRef:
    name: technitium-letsencrypt
    kind: ClusterIssuer
  commonName: "*.lab.apj.dev"
  dnsNames:
  - "lab.apj.dev"
  - "*.lab.apj.dev"