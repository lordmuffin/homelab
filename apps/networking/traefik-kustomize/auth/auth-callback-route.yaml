apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-auth-callback-route
  namespace: traefik
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.lab.apj.dev`) && Path(`/_oauth`)
      kind: Rule
      priority: 1000
      services:
        - name: traefik-forward-auth
          port: 4181
  tls:
    secretName: lab-apj-dev-tls