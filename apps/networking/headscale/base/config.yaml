server_url: https://hs.lab.apj.dev
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

ip_prefixes:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

noise:
  private_key_path: /vol/secret/noise_private.key

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /vol/secret/derp_server_private.key
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

ephemeral_node_inactivity_timeout: 30m
node_update_check_interval: 10s

private_key_path: /vol/secret/private.key

database:
  type: postgres
  postgres:
    host: headscale-database-rw
    port: 5432
    name: headscale
    user: headscale
    pass: ${HEADSCALE_DB_PASS}

log:
  level: info

dns:
  magic_dns: true
  base_domain: headscale.local
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8
  search_domains: []
