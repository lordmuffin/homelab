apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: services
  labels:
    app: litellm
  annotations:
    link.argocd.argoproj.io/external-link: https://litellm.lab.apj.dev/ui
spec:
  replicas: 1
  strategy:
    type: Recreate # Or RollingUpdate if preferred for zero-downtime
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data"] # LiteLLM image runs as appuser (UID 1000)
          volumeMounts:
            - name: litellm-data
              mountPath: /data
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.72.2-stable # Use a specific version
          imagePullPolicy: IfNotPresent
          # Default CMD: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
          # We provide config.yaml via ConfigMap mount. Port and host are fine.
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef: # For TZ, LITELLM_DATABASE_URL etc.
                name: litellm-config
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key-1password
                  key: password
            # Example: Add API keys from secrets
            # - name: OPENAI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: litellm-openai-api-key-1password # Ensure this secret exists
            #       key: password # Assuming the key in 1Password item is 'password'
            # - name: ANTHROPIC_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: litellm-anthropic-api-key-1password
            #       key: password
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml # Mount the config.yaml file
              subPath: config.yaml        # Specify the key from ConfigMap
            - name: litellm-data
              mountPath: /data # For SQLite DB, logs, and disk cache
          livenessProbe:
            httpGet:
              path: /health # LiteLLM health check endpoint
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: litellm-data
          persistentVolumeClaim:
            claimName: litellm-data-pvc