apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-postgres-backup
  namespace: services
spec:
  schedule: "0 3 * * *" # Daily at 3:00AM (offset from paperless and tandoor)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: postgres-backup
              image: postgres:latest
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: n8n-db-postgres-creds-1password
                      key: password
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: n8n-db-postgres-creds-1password
                      key: username
                - name: POSTGRES_HOST
                  value: n8n-database-rw.services.svc.cluster.local
                - name: POSTGRES_DB
                  value: n8n
              command: ["/bin/bash", "-c"]
              args:
                - |
                  # Strict error handling
                  set -euo pipefail
                  
                  # Retry configuration
                  MAX_RETRIES=5
                  RETRY_DELAYS=(10 20 40 80 160)
                  
                  # Logging functions
                  log_info() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] INFO: $*" >&2
                  }
                  
                  log_error() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ERROR: $*" >&2
                  }
                  
                  # Error trap handler
                  error_trap() {
                      local exit_code=$?
                      local line_number=$1
                      log_error "N8n backup failed at line $line_number with exit code $exit_code"
                      log_error "Command: ${BASH_COMMAND}"
                      exit $exit_code
                  }
                  
                  trap 'error_trap $LINENO' ERR
                  
                  # Retry function with exponential backoff
                  retry_with_backoff() {
                      local cmd="$1"
                      local attempt=1
                      
                      while [[ $attempt -le $MAX_RETRIES ]]; do
                          log_info "Attempt $attempt/$MAX_RETRIES: $cmd"
                          
                          if eval "$cmd"; then
                              log_info "Command succeeded on attempt $attempt"
                              return 0
                          else
                              local exit_code=$?
                              log_error "Command failed on attempt $attempt with exit code $exit_code"
                              
                              if [[ $attempt -eq $MAX_RETRIES ]]; then
                                  log_error "All $MAX_RETRIES attempts failed"
                                  return $exit_code
                              fi
                              
                              local delay=${RETRY_DELAYS[$((attempt-1))]}
                              log_info "Waiting $delay seconds before next attempt..."
                              sleep "$delay"
                              ((attempt++))
                          fi
                      done
                  }
                  
                  BACKUP_FILE="pg_backup_$(date +%Y%m%d_%H%M%S).sql.gz"
                  
                  log_info "🔄 Starting N8n PostgreSQL backup: $BACKUP_FILE"
                  log_info "Connecting to: $POSTGRES_HOST as $POSTGRES_USER for database $POSTGRES_DB"
                  
                  # Validate environment variables
                  if [[ -z "${POSTGRES_HOST:-}" || -z "${POSTGRES_USER:-}" || -z "${POSTGRES_DB:-}" ]]; then
                      log_error "Missing required environment variables"
                      exit 1
                  fi
                  
                  # Test connection with retry
                  retry_with_backoff "pg_isready -h '$POSTGRES_HOST' -U '$POSTGRES_USER' -d '$POSTGRES_DB'"
                  
                  # Create backup of specific N8n database with retry
                  retry_with_backoff "pg_dump -h '$POSTGRES_HOST' -U '$POSTGRES_USER' -d '$POSTGRES_DB' --verbose --no-owner --no-privileges | gzip > /mnt/backup/$BACKUP_FILE"
                  
                  # Validate backup file
                  if [[ ! -f "/mnt/backup/$BACKUP_FILE" ]]; then
                      log_error "Backup file not created: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  if [[ ! -s "/mnt/backup/$BACKUP_FILE" ]]; then
                      log_error "Backup file is empty: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  # Test compressed file integrity
                  if ! gzip -t "/mnt/backup/$BACKUP_FILE"; then
                      log_error "Backup file is corrupted: /mnt/backup/$BACKUP_FILE"
                      exit 1
                  fi
                  
                  # Log success with file size
                  BACKUP_SIZE=$(du -h "/mnt/backup/$BACKUP_FILE" | cut -f1)
                  log_info "✅ Backup completed successfully: $BACKUP_FILE ($BACKUP_SIZE)"
                  
                  # Signal the next container that the dump is completed
                  touch /mnt/backup/.done                  
              volumeMounts:
                - name: backup-storage
                  mountPath: /mnt/backup
            - name: b2-uploader
              image: backblazeit/b2:latest
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"
              env:
                - name: B2_APPLICATION_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: keyID
                - name: B2_APPLICATION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: applicationKey
                - name: B2_BUCKET_NAME
                  value: "cloud-homelab-backups"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  # Strict error handling
                  set -euo pipefail
                  
                  # Retry configuration
                  MAX_RETRIES=5
                  RETRY_DELAYS=(10 20 40 80 160)
                  
                  # Logging functions
                  log_info() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] INFO: $*" >&2
                  }
                  
                  log_error() {
                      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ERROR: $*" >&2
                  }
                  
                  # Error trap handler
                  error_trap() {
                      local exit_code=$?
                      local line_number=$1
                      log_error "B2 upload failed at line $line_number with exit code $exit_code"
                      log_error "Command: ${BASH_COMMAND}"
                      exit $exit_code
                  }
                  
                  trap 'error_trap $LINENO' ERR
                  
                  # Retry function with exponential backoff
                  retry_with_backoff() {
                      local cmd="$1"
                      local attempt=1
                      
                      while [[ $attempt -le $MAX_RETRIES ]]; do
                          log_info "Attempt $attempt/$MAX_RETRIES: $cmd"
                          
                          if eval "$cmd"; then
                              log_info "Command succeeded on attempt $attempt"
                              return 0
                          else
                              local exit_code=$?
                              log_error "Command failed on attempt $attempt with exit code $exit_code"
                              
                              if [[ $attempt -eq $MAX_RETRIES ]]; then
                                  log_error "All $MAX_RETRIES attempts failed"
                                  return $exit_code
                              fi
                              
                              local delay=${RETRY_DELAYS[$((attempt-1))]}
                              log_info "Waiting $delay seconds before next attempt..."
                              sleep "$delay"
                              ((attempt++))
                          fi
                      done
                  }
                  
                  log_info "🔄 Starting B2 upload process for N8n..."
                  
                  # Validate environment variables
                  if [[ -z "${B2_APPLICATION_KEY_ID:-}" || -z "${B2_APPLICATION_KEY:-}" || -z "${B2_BUCKET_NAME:-}" ]]; then
                      log_error "Missing required B2 environment variables"
                      exit 1
                  fi
                  
                  # Wait for backup completion with timeout (max 30 minutes)
                  timeout=1800  # 30 minutes
                  elapsed=0
                  while [[ ! -f /mnt/backup/.done ]]; do
                      if [[ $elapsed -ge $timeout ]]; then
                          log_error "Timeout waiting for backup completion"
                          exit 1
                      fi
                      log_info "Waiting for backup completion... (${elapsed}s elapsed)"
                      sleep 5
                      ((elapsed+=5))
                  done
                  
                  # Find the backup file
                  BACKUP_FILE=$(ls /mnt/backup/pg_backup_*.sql.gz | head -1 2>/dev/null || true)
                  if [[ -z "$BACKUP_FILE" ]]; then
                      log_error "No backup file found matching pattern: pg_backup_*.sql.gz"
                      exit 1
                  fi
                  
                  # Validate backup file exists and has content
                  if [[ ! -f "$BACKUP_FILE" ]]; then
                      log_error "Backup file not found: $BACKUP_FILE"
                      exit 1
                  fi
                  
                  if [[ ! -s "$BACKUP_FILE" ]]; then
                      log_error "Backup file is empty: $BACKUP_FILE"
                      exit 1
                  fi
                  
                  # Upload to B2 with retry
                  UPLOAD_PATH="n8n/$(basename "$BACKUP_FILE")"
                  log_info "Uploading to B2: $UPLOAD_PATH"
                  retry_with_backoff "b2v4 file upload '$B2_BUCKET_NAME' '$BACKUP_FILE' '$UPLOAD_PATH'"
                  
                  log_info "✅ B2 upload completed successfully: $UPLOAD_PATH"
                  
                  # Note: Retention cleanup is handled by B2 lifecycle rules or external cleanup jobs
                  # to avoid dependency issues with jq in the B2 container image
                  
                  log_info "✅ N8n backup process completed successfully"                 
              volumeMounts:
                - name: backup-storage
                  mountPath: /mnt/backup
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              emptyDir: {}