apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-internal
  annotations:
    external-dns.alpha.kubernetes.io/hostname: n8n.lab.apj.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "120"
    cert-manager.io/cluster-issuer: letsencrypt-production
    acme.cert-manager.io/http01-edit-in-place: "true"
    kubernetes.io/ingress.class: traefik-external
  labels:
    app: n8n
spec:
  entryPoints:
    - websecure
  routes:
    # Route 1: API endpoints without authentication
    - match: Host(`n8n.lab.apj.dev`) && PathPrefix(`/webhook-test`)
      kind: Rule
      services:
        - name: n8n
          port: 80
      # No middlewares = no authentication required
    
    # Route 2: Webhook endpoints without authentication (if needed)
    - match: Host(`n8n.lab.apj.dev`) && PathPrefix(`/webhook`)
      kind: Rule
      services:
        - name: n8n
          port: 80
      # No middlewares = no authentication required
    
    # Route 3: All other paths require authentication
    - match: Host(`n8n.lab.apj.dev`)
      kind: Rule
      services:
        - name: n8n
          port: 80
      middlewares:
        - name: traefik-forward-auth
          namespace: traefik
  tls:
    secretName: lab-apj-dev-tls
