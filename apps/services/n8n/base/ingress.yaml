apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-internal
  annotations:
    external-dns.alpha.kubernetes.io/hostname: n8n.lab.apj.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "120"
    cert-manager.io/cluster-issuer: letsencrypt-production
    acme.cert-manager.io/http01-edit-in-place: "true"
    kubernetes.io/ingress.class: traefik-external
  labels:
    app: n8n
spec:
  entryPoints:
    - websecure
  routes:
    # Route for all paths - uses default auth (since global auth is on websecure entrypoint)
    - match: Host(`n8n.lab.apj.dev`)
      kind: Rule
      services:
        - name: n8n
          port: 80
      priority: 1
  tls:
    secretName: lab-apj-dev-tls
