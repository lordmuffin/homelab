apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 2 * * *" # Daily at 2AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: postgres-backup
              image: postgres:latest
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tandoor-db-postgres-creds-1password
                      key: password
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: tandoor-db-postgres-creds-1password
                      key: username
                - name: POSTGRES_HOST
                  value: tandoor-database-rw.tandoor.svc.cluster.local
                - name: POSTGRES_DB
                  value: tandoor
              command: ["/bin/sh", "-c"]
              args:
                - |
                  BACKUP_FILE="pg_backup_$(date +%Y%m%d_%H%M%S).sql.gz"
                  echo "Creating backup $BACKUP_FILE..."
                  echo "Connecting to: $POSTGRES_HOST as $POSTGRES_USER for database $POSTGRES_DB"
                  
                  # Test connection first
                  if ! pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
                    echo "ERROR: Cannot connect to database at $POSTGRES_HOST"
                    exit 1
                  fi
                  
                  # Create backup of specific Tandoor database (not pg_dumpall)
                  if pg_dump -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" --verbose --no-owner --no-privileges | gzip > /mnt/backup/$BACKUP_FILE; then
                    echo "Backup completed successfully: $BACKUP_FILE"
                    ls -lh /mnt/backup/$BACKUP_FILE
                  else
                    echo "ERROR: Backup failed"
                    exit 1
                  fi
                  
                  # signal the next container that the dump is completed
                  touch /mnt/backup/.done                  
              volumeMounts:
                - name: backup-storage
                  mountPath: /mnt/backup
            - name: b2-uploader
              image: backblazeit/b2:latest
              env:
                - name: B2_APPLICATION_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: keyID
                - name: B2_APPLICATION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backblaze-cloud-homelab-creds-1password
                      key: applicationKey
                - name: B2_BUCKET_NAME
                  value: "cloud-homelab-backups"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # Check every 5 seconds if the dump is completed
                  while [ ! -f /mnt/backup/.done ]; do
                    sleep 5  
                  done
                  BACKUP_FILE=$(ls /mnt/backup/pg_backup_*.sql.gz)
                  b2v4 file upload $B2_BUCKET_NAME "$BACKUP_FILE" tandoor/"$(basename $BACKUP_FILE)"                  
              volumeMounts:
                - name: backup-storage
                  mountPath: /mnt/backup
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              emptyDir: {}