---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tandoor
  name: tandoor
spec:
  replicas: 1
  strategy: {}
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: tandoor
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: restore-db-backup
        image: alpine:latest
        # This init container combines PostgreSQL and b2 CLI for backup restoration
        env:
        - name: B2_APPLICATION_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: keyID
        - name: B2_APPLICATION_KEY
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: applicationKey
        - name: B2_BUCKET_NAME
          value: "cloud-homelab-backups"
        - name: POSTGRES_HOST
          value: tandoor-database-rw.tandoor.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: tandoor
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: password
        - name: FORCE_RESTORE
          value: "false"
        - name: RESTORE_MEDIA
          value: "true"
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Installing required dependencies..."
          apk add --no-cache postgresql-client curl unzip bash
          
          echo "Validating environment variables..."
          echo "B2_APPLICATION_KEY_ID length: ${#B2_APPLICATION_KEY_ID}"
          echo "B2_APPLICATION_KEY length: ${#B2_APPLICATION_KEY}"
          echo "B2_BUCKET_NAME: $B2_BUCKET_NAME"
          
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "ERROR: B2 credentials not available. Skipping backup restoration."
            exit 0
          fi
          
          echo "Installing B2 CLI..."
          curl -L https://github.com/Backblaze/B2_Command_Line_Tool/releases/latest/download/b2-linux -o /usr/local/bin/b2
          chmod +x /usr/local/bin/b2
          
          echo "Authenticating with B2..."
          /usr/local/bin/b2 authorize-account $B2_APPLICATION_KEY_ID $B2_APPLICATION_KEY
          
          echo "Checking for backups in B2 bucket..."
          # List backups using correct B2 URI syntax
          echo "Searching for tandoor backups in B2..."
          BACKUP_LIST=$(/usr/local/bin/b2 ls "b2://$B2_BUCKET_NAME/tandoor/" --recursive 2>/dev/null || echo "")
          
          if [ -z "$BACKUP_LIST" ]; then
            echo "No files found in tandoor/ folder. Checking if folder exists..."
            FOLDER_CHECK=$(/usr/local/bin/b2 ls "b2://$B2_BUCKET_NAME" 2>/dev/null | grep "tandoor/" || echo "")
            if [ -z "$FOLDER_CHECK" ]; then
              echo "No tandoor/ folder found in bucket. No backups available."
            else
              echo "tandoor/ folder exists but contains no backup files."
            fi
            echo "Skipping restoration - starting with empty database."
            exit 0
          fi
          
          # Find the latest backup file
          echo "Found backup files, searching for latest..."
          LATEST_BACKUP=$(echo "$BACKUP_LIST" | grep -E 'pg_backup_[0-9]{8}_[0-9]{6}\.sql\.gz' | sort -r | head -n 1 | awk '{print $NF}')
          
          if [ -z "$LATEST_BACKUP" ]; then
            echo "No valid backup files found matching pattern pg_backup_YYYYMMDD_HHMMSS.sql.gz"
            echo "Available files in tandoor/ folder:"
            echo "$BACKUP_LIST"
            echo "Skipping restoration - starting with empty database."
            exit 0
          fi
          
          # Strip tandoor/ prefix if present (since ls includes folder path)
          BACKUP_FILENAME=$(echo "$LATEST_BACKUP" | sed 's|^tandoor/||')
          echo "Found latest backup file: $BACKUP_FILENAME"
          echo "Debug - Original: $LATEST_BACKUP, Cleaned: $BACKUP_FILENAME"
          
          # Create temp directory for backup
          mkdir -p /tmp/backup
          
          # Download the backup using B2 CLI
          echo "Downloading backup: $BACKUP_FILENAME"
          echo "B2 CLI version:"
          /usr/local/bin/b2 version
          
          # Try older B2 CLI download syntax first (legacy compatibility)
          echo "Attempting legacy B2 download syntax..."
          if /usr/local/bin/b2 download_file_by_name "$B2_BUCKET_NAME" "tandoor/$BACKUP_FILENAME" /tmp/backup/latest.sql.gz 2>/dev/null; then
            echo "Downloaded successfully using legacy syntax"
          else
            echo "Legacy syntax failed, trying modern file download..."
            # Try modern B2 URI format
            BACKUP_URI="b2://$B2_BUCKET_NAME/tandoor/$BACKUP_FILENAME"
            if ! /usr/local/bin/b2 file download "$BACKUP_URI" /tmp/backup/latest.sql.gz 2>/dev/null; then
              echo "Both download methods failed. Skipping restoration."
              exit 0
            fi
          fi
          
          echo "Backup downloaded successfully."
          
          # Check database connectivity and if it has data
          echo "Testing database connectivity..."
          if ! PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1;" >/dev/null 2>&1; then
            echo "ERROR: Cannot connect to database at $POSTGRES_HOST. Check database configuration."
            exit 1
          fi
          
          echo "Checking if database contains user data..."
          # Check for actual user content in key Tandoor tables instead of just schema
          # These tables would only have meaningful data if users have actually used the app
          USER_RECIPES=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM cookbook_recipe WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          USER_KEYWORDS=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM cookbook_keyword WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          USER_FOODS=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM cookbook_food WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          
          echo "Found $USER_RECIPES recipes, $USER_KEYWORDS keywords, $USER_FOODS foods in database"
          
          # Check if restoration should be forced
          if [ "${FORCE_RESTORE:-false}" = "true" ]; then
            echo "⚠️  FORCE_RESTORE=true detected. Proceeding with restoration despite existing user data."
            echo "⚠️  This will overwrite all existing recipes, keywords, and foods."
          elif [ "$USER_RECIPES" -gt "0" ] || [ "$USER_KEYWORDS" -gt "10" ] || [ "$USER_FOODS" -gt "10" ]; then
            echo "Database contains user data (recipes: $USER_RECIPES). Skipping restoration to prevent data loss."
            echo "💡 To force restoration, set FORCE_RESTORE=true environment variable."
            exit 0
          fi
          
          echo "Database appears to contain only default/seed data. Proceeding with backup restoration..."
          
          # Validate backup file
          echo "Validating backup file..."
          if [ ! -f /tmp/backup/latest.sql.gz ]; then
            echo "ERROR: Backup file not found after download."
            exit 1
          fi
          
          # Check if file is valid gzip
          if ! gunzip -t /tmp/backup/latest.sql.gz 2>/dev/null; then
            echo "ERROR: Downloaded backup file is corrupted or not a valid gzip file."
            exit 1
          fi
          
          # Clear existing database to avoid conflicts
          echo "Clearing existing database for clean restoration..."
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "
            DO \$\$ DECLARE
              r RECORD;
            BEGIN
              -- Drop all tables in the public schema
              FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP TABLE IF EXISTS public.' || quote_ident(r.tablename) || ' CASCADE';
              END LOOP;
              
              -- Drop all sequences in the public schema
              FOR r IN (SELECT sequencename FROM pg_sequences WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP SEQUENCE IF EXISTS public.' || quote_ident(r.sequencename) || ' CASCADE';
              END LOOP;
            END \$\$;
          "
          
          echo "Database cleared successfully. Starting restoration..."
          
          # Restore the backup
          echo "Restoring database from backup: $LATEST_BACKUP"
          if gunzip -c /tmp/backup/latest.sql.gz | PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -q; then
            echo "Database restoration completed successfully."
            
            # Verify restoration by checking table count
            RESTORED_TABLES=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/dev/null | tr -d ' ')
            echo "Restored database contains $RESTORED_TABLES tables."
            
            # Check for restored user data
            USER_RECIPES_RESTORED=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM cookbook_recipe WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
            USER_SPACES_RESTORED=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM cookbook_space WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
            echo "Restored $USER_RECIPES_RESTORED recipes and $USER_SPACES_RESTORED spaces from backup."
          else
            echo "ERROR: Database restoration failed."
            exit 1
          fi
          
          # MEDIA RESTORATION LOGIC
          if [ "${RESTORE_MEDIA:-true}" = "true" ]; then
            echo "🔄 Checking for media backup restoration..."
            
            # Check if media directories already have content
            STATIC_COUNT=$(find /opt/recipes/staticfiles -type f 2>/dev/null | wc -l || echo "0")
            MEDIA_COUNT=$(find /opt/recipes/mediafiles -type f 2>/dev/null | wc -l || echo "0")
            
            echo "Current media files - Static: $STATIC_COUNT, Media: $MEDIA_COUNT"
            
            # Skip if media already exists (unless FORCE_RESTORE=true)
            if [ "${FORCE_RESTORE:-false}" != "true" ] && [ "$MEDIA_COUNT" -gt "0" ]; then
              echo "Media files already exist. Skipping media restoration."
              echo "💡 To force media restoration, set FORCE_RESTORE=true"
            else
              echo "Searching for latest media backup..."
              MEDIA_BACKUP_LIST=$(/usr/local/bin/b2 ls "b2://$B2_BUCKET_NAME/tandoor/media/" --recursive 2>/dev/null || echo "")
              
              if [ -n "$MEDIA_BACKUP_LIST" ]; then
                LATEST_MEDIA_BACKUP=$(echo "$MEDIA_BACKUP_LIST" | \
                                     grep -E 'tandoor_media_[0-9]{8}_[0-9]{6}\.tar\.gz' | \
                                     sort -r | head -n 1 | awk '{print $NF}')
                
                if [ -n "$LATEST_MEDIA_BACKUP" ]; then
                  echo "Found latest media backup: $LATEST_MEDIA_BACKUP"
                  
                  # Download media backup
                  mkdir -p /tmp/media
                  MEDIA_FILENAME=$(basename "$LATEST_MEDIA_BACKUP")
                  
                  echo "Downloading media backup..."
                  if /usr/local/bin/b2 file download "b2://$B2_BUCKET_NAME/$LATEST_MEDIA_BACKUP" "/tmp/media/$MEDIA_FILENAME"; then
                    echo "Media backup downloaded successfully"
                    
                    # Validate archive
                    if tar -tzf "/tmp/media/$MEDIA_FILENAME" >/dev/null 2>&1; then
                      echo "Archive validation successful"
                      
                      # Clear existing media if forcing restore
                      if [ "${FORCE_RESTORE:-false}" = "true" ]; then
                        echo "⚠️  FORCE_RESTORE enabled - clearing existing media files"
                        rm -rf /opt/recipes/staticfiles/* /opt/recipes/mediafiles/* 2>/dev/null || true
                      fi
                      
                      # Extract media files
                      echo "Extracting media files..."
                      cd /opt/recipes
                      if tar -xzf "/tmp/media/$MEDIA_FILENAME" --strip-components=0; then
                        # Verify extraction
                        RESTORED_STATIC=$(find staticfiles -type f 2>/dev/null | wc -l || echo "0")
                        RESTORED_MEDIA=$(find mediafiles -type f 2>/dev/null | wc -l || echo "0")
                        echo "✅ Media restoration completed - Static: $RESTORED_STATIC, Media: $RESTORED_MEDIA files"
                      else
                        echo "❌ Media extraction failed"
                      fi
                    else
                      echo "❌ Media archive validation failed"
                    fi
                  else
                    echo "❌ Media backup download failed"
                  fi
                else
                  echo "No valid media backup files found"
                fi
              else
                echo "No media backups available in B2"
              fi
            fi
          else
            echo "Media restoration disabled (RESTORE_MEDIA=false)"
          fi
          
          echo "Init container completed successfully"
      containers:
      - name: recipes
        image: vabene1111/recipes
        imagePullPolicy: Always
        # command: ["sh", "-c", "(sleep 10 && chmod a+rwx /run/user/1000/docker.sock) & /usr/bin/supervisord -c /etc/supervisord.conf"]
        env:
        - name: UID
          value: "1000"
        - name: GID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tandoor-secret-creds-1password
              key: password
        - name: DB_ENGINE
          value: django.db.backends.postgresql
        - name: POSTGRES_HOST
          value: tandoor-database-rw.tandoor.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: tandoor
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: password
        - name: GUNICORN_MEDIA
          value: "1"
        # - name: SOCIALACCOUNT_PROVIDERS
        #   value: |
        #     {
        #       "microsoft": {
        #           "APPS": [
        #               {
        #                   "client_id": "<insert-id>",
        #                   "secret": "<insert-secret>",
        #                   "settings": {
        #                       "tenant": "organizations",
        #                       # Optional: override URLs (use base URLs without path)
        #                       "login_url": "https://login.microsoftonline.com",
        #                       "graph_url": "https://graph.microsoft.com",
        #                   }
        #               }
        #           ]
        #       }
        #     }
        ports:
          - name: web
            containerPort: 8080
            protocol: TCP
        volumeMounts:
        - name: recipes-static
          mountPath: /opt/recipes/staticfiles
        - name: recipes-media
          mountPath: /opt/recipes/mediafiles
      volumes:
        - name: recipes-static
          persistentVolumeClaim:
            claimName: recipes-static
        - name: recipes-media
          persistentVolumeClaim:
            claimName: recipes-media