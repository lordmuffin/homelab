---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tandoor
  name: tandoor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tandoor
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: tandoor
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      containers:
      - name: recipes
        image: vabene1111/recipes
        imagePullPolicy: Always
        # command: ["sh", "-c", "(sleep 10 && chmod a+rwx /run/user/1000/docker.sock) & /usr/bin/supervisord -c /etc/supervisord.conf"]
        env:
        - name: UID
          value: "1000"
        - name: GID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
        ports:
          - name: web
            containerPort: 8080
            protocol: TCP
        volumeMounts:
        - name: recipes-static
          mountPath: /opt/recipes/staticfiles
        - name: recipes-media
          mountPath: opt/recipes/mediafiles
