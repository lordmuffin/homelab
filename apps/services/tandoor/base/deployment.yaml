---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tandoor
  name: tandoor
spec:
  replicas: 1
  strategy: {}
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: tandoor
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: restore-db-backup
        image: alpine:latest
        # This init container combines PostgreSQL and b2 CLI for backup restoration
        env:
        - name: B2_APPLICATION_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: keyID
        - name: B2_APPLICATION_KEY
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: applicationKey
        - name: B2_BUCKET_NAME
          value: "cloud-homelab-backups"
        - name: POSTGRES_HOST
          value: tandoor-database-rw.tandoor.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: tandoor
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: password
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Installing required dependencies..."
          apk add --no-cache postgresql-client curl unzip
          
          echo "Validating environment variables..."
          echo "B2_APPLICATION_KEY_ID length: ${#B2_APPLICATION_KEY_ID}"
          echo "B2_APPLICATION_KEY length: ${#B2_APPLICATION_KEY}"
          echo "B2_BUCKET_NAME: $B2_BUCKET_NAME"
          
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "ERROR: B2 credentials not available. Skipping backup restoration."
            exit 0
          fi
          
          echo "Installing B2 CLI..."
          curl -L https://github.com/Backblaze/B2_Command_Line_Tool/releases/latest/download/b2-linux -o /usr/local/bin/b2v4
          chmod +x /usr/local/bin/b2v4
          
          echo "Authenticating with B2..."
          /usr/local/bin/b2v4 authorize-account $B2_APPLICATION_KEY_ID $B2_APPLICATION_KEY
          
          echo "Checking for backups in B2 bucket..."
          # List backups using correct B2 CLI syntax (bucket name with b2:// prefix)
          LATEST_BACKUP=$(/usr/local/bin/b2v4 file list $B2_BUCKET_NAME tandoor/ --recursive | grep -E 'pg_backup_[0-9]{8}_[0-9]{6}.sql.gz' | sort -r | head -n 1 | awk '{print $1}')
          
          if [ -z "$LATEST_BACKUP" ]; then
            echo "No backup found in B2 bucket. Skipping restoration."
            exit 0
          fi
          
          echo "Found latest backup: $LATEST_BACKUP"
          
          # Create temp directory for backup
          mkdir -p /tmp/backup
          
          # Download the backup
          echo "Downloading backup from B2..."
          /usr/local/bin/b2v4 file download "b2://$B2_BUCKET_NAME/$LATEST_BACKUP" /tmp/backup/latest.sql.gz
          
          # Check if database already has data
          echo "Checking if database is empty..."
          TABLES=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';")
          
          if [ "$TABLES" -gt "0" ]; then
            echo "Database already contains tables. Skipping restoration to prevent data loss."
            exit 0
          fi
          
          # Restore the backup
          echo "Restoring database from backup..."
          gunzip -c /tmp/backup/latest.sql.gz | PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB
          
          echo "Database restoration completed successfully."
      containers:
      - name: recipes
        image: vabene1111/recipes
        imagePullPolicy: Always
        # command: ["sh", "-c", "(sleep 10 && chmod a+rwx /run/user/1000/docker.sock) & /usr/bin/supervisord -c /etc/supervisord.conf"]
        env:
        - name: UID
          value: "1000"
        - name: GID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tandoor-secret-creds-1password
              key: password
        - name: DB_ENGINE
          value: django.db.backends.postgresql
        - name: POSTGRES_HOST
          value: tandoor-database-rw.tandoor.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: tandoor
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tandoor-db-postgres-creds-1password
              key: password
        # - name: SOCIALACCOUNT_PROVIDERS
        #   value: |
        #     {
        #       "microsoft": {
        #           "APPS": [
        #               {
        #                   "client_id": "<insert-id>",
        #                   "secret": "<insert-secret>",
        #                   "settings": {
        #                       "tenant": "organizations",
        #                       # Optional: override URLs (use base URLs without path)
        #                       "login_url": "https://login.microsoftonline.com",
        #                       "graph_url": "https://graph.microsoft.com",
        #                   }
        #               }
        #           ]
        #       }
        #     }
        ports:
          - name: web
            containerPort: 8080
            protocol: TCP
        volumeMounts:
        - name: recipes-static
          mountPath: /opt/recipes/staticfiles
        - name: recipes-media
          mountPath: opt/recipes/mediafiles
      volumes:
        - name: recipes-static
          persistentVolumeClaim:
            claimName: recipes-static
        - name: recipes-media
          persistentVolumeClaim:
            claimName: recipes-media