---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: actual-database
  namespace: services
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2-10
  instances: 1
  startDelay: 35
  stopDelay: 35
  resources:
    requests:
      memory: 256Mi
      cpu: 300m
    limits:
      memory: 768Mi
      cpu: 700m
  postgresql:
    parameters:
      shared_buffers: 256MB
      timezone: "America/Chicago"
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'

  bootstrap:
    initdb:
      database: actual
      owner: actual
      secret:
        name: actual-db-postgres-creds-1password

  storage:
    storageClass: ssd
    size: 10Gi

  monitoring:
    enabled: true
    prometheusRule:
      enabled: false