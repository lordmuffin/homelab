---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      initContainers:
      - name: restore-db-backup
        image: alpine:latest
        # This init container combines PostgreSQL and B2 CLI for backup restoration
        env:
        - name: B2_APPLICATION_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: keyID
        - name: B2_APPLICATION_KEY
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: applicationKey
        - name: B2_BUCKET_NAME
          value: "cloud-homelab-backups"
        - name: POSTGRES_HOST
          value: paperless-database-rw.paperless.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: paperless
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: paperless-db-postgres-creds-1password
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paperless-db-postgres-creds-1password
              key: password
        - name: FORCE_RESTORE
          value: "false"
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Installing required dependencies..."
          apk add --no-cache postgresql-client curl unzip bash
          
          echo "Validating environment variables..."
          echo "B2_APPLICATION_KEY_ID length: ${#B2_APPLICATION_KEY_ID}"
          echo "B2_APPLICATION_KEY length: ${#B2_APPLICATION_KEY}"
          echo "B2_BUCKET_NAME: $B2_BUCKET_NAME"
          
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "ERROR: B2 credentials not available. Skipping backup restoration."
            exit 0
          fi
          
          echo "Installing B2 CLI..."
          curl -L https://github.com/Backblaze/B2_Command_Line_Tool/releases/latest/download/b2-linux -o /usr/local/bin/b2
          chmod +x /usr/local/bin/b2
          
          echo "Authenticating with B2..."
          /usr/local/bin/b2 authorize-account $B2_APPLICATION_KEY_ID $B2_APPLICATION_KEY
          
          echo "Checking for backups in B2 bucket..."
          # List backups using correct B2 URI syntax
          echo "Searching for paperless backups in B2..."
          BACKUP_LIST=$(/usr/local/bin/b2 ls "b2://$B2_BUCKET_NAME/paperless/" --recursive 2>/dev/null || echo "")
          
          if [ -z "$BACKUP_LIST" ]; then
            echo "No files found in paperless/ folder. Checking if folder exists..."
            FOLDER_CHECK=$(/usr/local/bin/b2 ls "b2://$B2_BUCKET_NAME" 2>/dev/null | grep "paperless/" || echo "")
            if [ -z "$FOLDER_CHECK" ]; then
              echo "No paperless/ folder found in bucket. No backups available."
            else
              echo "paperless/ folder exists but contains no backup files."
            fi
            echo "Skipping restoration - starting with empty database."
            exit 0
          fi
          
          # Find the latest backup file
          echo "Found backup files, searching for latest..."
          LATEST_BACKUP=$(echo "$BACKUP_LIST" | grep -E 'pg_backup_[0-9]{8}_[0-9]{6}\.sql\.gz' | sort -r | head -n 1 | awk '{print $NF}')
          
          if [ -z "$LATEST_BACKUP" ]; then
            echo "No valid backup files found matching pattern pg_backup_YYYYMMDD_HHMMSS.sql.gz"
            echo "Available files in paperless/ folder:"
            echo "$BACKUP_LIST"
            echo "Skipping restoration - starting with empty database."
            exit 0
          fi
          
          # Strip paperless/ prefix if present (since ls includes folder path)
          BACKUP_FILENAME=$(echo "$LATEST_BACKUP" | sed 's|^paperless/||')
          echo "Found latest backup file: $BACKUP_FILENAME"
          echo "Debug - Original: $LATEST_BACKUP, Cleaned: $BACKUP_FILENAME"
          
          # Create temp directory for backup
          mkdir -p /tmp/backup
          
          # Download the backup using B2 CLI
          echo "Downloading backup: $BACKUP_FILENAME"
          echo "B2 CLI version:"
          /usr/local/bin/b2 version
          
          # Try older B2 CLI download syntax first (legacy compatibility)
          echo "Attempting legacy B2 download syntax..."
          if /usr/local/bin/b2 download_file_by_name "$B2_BUCKET_NAME" "paperless/$BACKUP_FILENAME" /tmp/backup/latest.sql.gz 2>/dev/null; then
            echo "Downloaded successfully using legacy syntax"
          else
            echo "Legacy syntax failed, trying modern file download..."
            # Try modern B2 URI format
            BACKUP_URI="b2://$B2_BUCKET_NAME/paperless/$BACKUP_FILENAME"
            if ! /usr/local/bin/b2 file download "$BACKUP_URI" /tmp/backup/latest.sql.gz 2>/dev/null; then
              echo "Both download methods failed. Skipping restoration."
              exit 0
            fi
          fi
          
          echo "Backup downloaded successfully."
          
          # Check database connectivity and if it has data
          echo "Testing database connectivity..."
          if ! PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1;" >/dev/null 2>&1; then
            echo "ERROR: Cannot connect to database at $POSTGRES_HOST. Check database configuration."
            exit 1
          fi
          
          echo "Checking if database contains user data..."
          # Check for actual user content in key Paperless tables instead of just schema
          # These tables would only have meaningful data if users have actually used the app
          USER_DOCUMENTS=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM documents_document WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          USER_TAGS=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM documents_tag WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          USER_CORRESPONDENTS=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM documents_correspondent WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          
          echo "Found $USER_DOCUMENTS documents, $USER_TAGS tags, $USER_CORRESPONDENTS correspondents in database"
          
          # Check if restoration should be forced
          if [ "${FORCE_RESTORE:-false}" = "true" ]; then
            echo "⚠️  FORCE_RESTORE=true detected. Proceeding with restoration despite existing user data."
            echo "⚠️  This will overwrite all existing documents, tags, and correspondents."
          elif [ "$USER_DOCUMENTS" -gt "0" ] || [ "$USER_TAGS" -gt "10" ] || [ "$USER_CORRESPONDENTS" -gt "5" ]; then
            echo "Database contains user data (documents: $USER_DOCUMENTS). Skipping restoration to prevent data loss."
            echo "💡 To force restoration, set FORCE_RESTORE=true environment variable."
            exit 0
          fi
          
          echo "Database appears to contain only default/seed data. Proceeding with backup restoration..."
          
          # Validate backup file
          echo "Validating backup file..."
          if [ ! -f /tmp/backup/latest.sql.gz ]; then
            echo "ERROR: Backup file not found after download."
            exit 1
          fi
          
          # Check if file is valid gzip
          if ! gunzip -t /tmp/backup/latest.sql.gz 2>/dev/null; then
            echo "ERROR: Downloaded backup file is corrupted or not a valid gzip file."
            exit 1
          fi
          
          # Clear existing database to avoid conflicts
          echo "Clearing existing database for clean restoration..."
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "
            DO \$\$ DECLARE
              r RECORD;
            BEGIN
              -- Drop all tables in the public schema
              FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP TABLE IF EXISTS public.' || quote_ident(r.tablename) || ' CASCADE';
              END LOOP;
              
              -- Drop all sequences in the public schema
              FOR r IN (SELECT sequencename FROM pg_sequences WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP SEQUENCE IF EXISTS public.' || quote_ident(r.sequencename) || ' CASCADE';
              END LOOP;
            END \$\$;
          "
          
          echo "Database cleared successfully. Starting restoration..."
          
          # Restore the backup
          echo "Restoring database from backup: $LATEST_BACKUP"
          if gunzip -c /tmp/backup/latest.sql.gz | PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -q; then
            echo "Database restoration completed successfully."
            
            # Verify restoration by checking table count
            RESTORED_TABLES=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/dev/null | tr -d ' ')
            echo "Restored database contains $RESTORED_TABLES tables."
            
            # Check for restored user data
            USER_DOCUMENTS_RESTORED=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM documents_document WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
            USER_TAGS_RESTORED=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM documents_tag WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
            echo "Restored $USER_DOCUMENTS_RESTORED documents and $USER_TAGS_RESTORED tags from backup."
          else
            echo "ERROR: Database restoration failed."
            exit 1
          fi
      - name: wait-for-db
        image: busybox:1.37
        command: ['sh', '-c', 'until nc -z paperless-database-rw.paperless.svc.cluster.local 5432; do echo "Waiting for Postgres..."; sleep 5; done']
        imagePullPolicy: IfNotPresent
      containers:
      - name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PAPERLESS_OCR_LANGUAGES
          value: jpn
        - name: PAPERLESS_OCR_LANGUAGE
          value: eng+jpn
        - name: PAPERLESS_PORT
          value: "8000"
        - name: PAPERLESS_REDIS
          value: redis://paperless-redis-standalone.paperless.svc.cluster.local:6379
        - name: PAPERLESS_DBHOST
          value: paperless-database-rw.paperless.svc.cluster.local
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          value: paperless
        - name: PAPERLESS_URL
          value: https://paperless.lab.apj.dev
        - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
          value: https://paperless.lab.apj.dev
        - name: PAPERLESS_DBPASS
          valueFrom: {secretKeyRef: {name: paperless-db-postgres-creds-1password, key: password}}
        - name: PAPERLESS_ADMIN_USER
          valueFrom: {secretKeyRef: {name: paperless-admin-creds-1password, key: username}}
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: paperless-admin-creds-1password, key: password}}
        ports:
          - name: web
            containerPort: 8000
        volumeMounts:
        - name: media
          mountPath: /usr/src/paperless/media
        - name: consume
          mountPath: /usr/src/paperless/consume
        startupProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media
      - name: consume
        persistentVolumeClaim:
          claimName: paperless-consume