apiVersion: apps/v1
kind: Deployment
metadata:
  name: grill-stats
  namespace: grill-stats
spec:
  # Single replica for development to save resources
  replicas: 1
  strategy:
    type: Recreate  # Simple strategy for development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: grill-stats
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-service
  namespace: grill-stats
spec:
  replicas: 1