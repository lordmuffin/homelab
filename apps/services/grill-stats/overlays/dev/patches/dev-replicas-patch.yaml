apiVersion: apps/v1
kind: Deployment
metadata:
  name: grill-stats
spec:
  # Single replica for development to save resources
  replicas: 1
  strategy:
    type: Recreate  # Simple strategy for development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-service
spec:
  replicas: 1
---
# Disable HPA in development
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grill-stats-hpa
spec:
  $patch: delete
---
# Disable PDB in development
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grill-stats-pdb
spec:
  $patch: delete