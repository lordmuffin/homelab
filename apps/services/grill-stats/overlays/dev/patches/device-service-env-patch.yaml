apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: grill-monitoring-dev
spec:
  template:
    spec:
      containers:
      - name: device-service
        env:
        # ThermoWorks Configuration
        - name: THERMOWORKS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: grill-stats-dev-creds-1password
              key: thermoworks-client-id
        - name: THERMOWORKS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grill-stats-dev-creds-1password
              key: thermoworks-client-secret
        - name: THERMOWORKS_REDIRECT_URI
          value: "http://localhost:8080/api/auth/thermoworks/callback"
        - name: THERMOWORKS_POLLING_INTERVAL
          value: "60"
        
        # Home Assistant Configuration
        - name: HOMEASSISTANT_URL
          value: "http://homeassistant.home.svc.cluster.local:8123"
        - name: HOMEASSISTANT_TOKEN
          valueFrom:
            secretKeyRef:
              name: grill-stats-dev-creds-1password
              key: homeassistant-token
        
        # Database Configuration
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@grill-stats-db.grill-monitoring-dev.svc.cluster.local:5432/grillstats
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: grill-stats-dev-creds-1password
              key: db-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grill-stats-dev-creds-1password
              key: db-password
        
        # Redis Configuration
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@redis.grill-monitoring-dev.svc.cluster.local:6379/0
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grill-stats-dev-creds-1password
              key: redis-password
        
        # RFX Gateway Configuration
        - name: RFX_SCAN_DURATION
          value: "30"
        - name: RFX_CONNECTION_TIMEOUT
          value: "15"
        - name: RFX_SETUP_TIMEOUT
          value: "300"