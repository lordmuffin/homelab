apiVersion: v1
kind: Namespace
metadata:
  name: grill-stats-dev
  labels:
    environment: development
    app.kubernetes.io/name: grill-stats
    app.kubernetes.io/instance: grill-stats-dev
    kubernetes.io/metadata.name: grill-stats-dev
    prometheus: enabled
  annotations:
    description: "Development environment for grill-stats temperature monitoring platform"
    contact: "dev-team@lab.apj.dev"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-resource-quota
  namespace: grill-stats-dev
spec:
  hard:
    # Reduced quotas for development
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"
    pods: "15"
    persistentvolumeclaims: "5"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-allow-all
  namespace: grill-stats-dev
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {}
  egress:
  - {}