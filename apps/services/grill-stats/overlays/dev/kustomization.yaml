apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grill-stats-dev

resources:
- ../../base
- ./patches/dev-namespace-patch.yaml

commonLabels:
  environment: development
  app.kubernetes.io/instance: grill-stats-dev

images:
- name: lordmuffin/grill-stats
  newTag: latest

replicas:
- name: grill-stats
  count: 1
- name: device-service  
  count: 1
- name: temperature-service
  count: 1