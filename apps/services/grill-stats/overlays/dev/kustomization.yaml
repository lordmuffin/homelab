apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grill-stats-dev

resources:
- ../../base
- ./secrets/grill-stats-dev-creds-1password.yaml
- ./patches/dev-namespace-patch.yaml

patchesStrategicMerge:
- patches/dev-env-patch.yaml

# namePrefix: dev-  # Removed to avoid strategic merge conflicts

commonLabels:
  environment: development
  app.kubernetes.io/instance: grill-stats-dev

configMapGenerator:
- name: grill-stats-dev-config
  literals:
  - MOCK_MODE=true
  - FLASK_ENV=development
  - DEBUG=true
  - LOG_LEVEL=DEBUG