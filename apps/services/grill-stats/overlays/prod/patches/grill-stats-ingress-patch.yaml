apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grill-stats
  namespace: grill-stats
spec:
  tls:
  - hosts:
    - grill-stats.lab.apj.dev
    secretName: lab-apj-dev-tls
  rules:
  - host: grill-stats.lab.apj.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grill-stats
            port:
              number: 5000