# Network policy to allow CloudNative-PG database pods to access Kubernetes API server
# This fixes the issue where initdb pods fail with "dial tcp 10.21.0.1:443: i/o timeout"
# when trying to communicate with the API server for cluster management operations
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-server-access
  namespace: grill-stats
  labels:
    app.kubernetes.io/name: grill-stats
    app.kubernetes.io/part-of: grill-stats
    app.kubernetes.io/component: networking
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: grill-stats-db
  policyTypes:
  - Egress
  egress:
  # Allow access to Kubernetes API server
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator-access
  namespace: grill-stats
  labels:
    app.kubernetes.io/name: grill-stats
    app.kubernetes.io/part-of: grill-stats
    app.kubernetes.io/component: networking
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: grill-stats-db
  policyTypes:
  - Egress
  egress:
  # Allow access to CloudNative-PG operator
  - to:
    - namespaceSelector:
        matchLabels:
          name: cnpg-system
  # Allow internal cluster communication
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: grill-stats-db