apiVersion: v1
kind: ResourceQuota
metadata:
  name: grill-stats-quota
  namespace: grill-stats
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 20Gi
    persistentvolumeclaims: "25"
    pods: "75"
    services: "25"
    services.loadbalancers: "2"