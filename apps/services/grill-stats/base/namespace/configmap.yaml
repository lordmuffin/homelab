apiVersion: v1
kind: ConfigMap
metadata:
  name: grill-stats-prod-creds-1password
  namespace: grill-stats
data:
  SYNC_INTERVAL: "300"
  TEMPERATURE_THRESHOLD_HIGH: "250"
  TEMPERATURE_THRESHOLD_LOW: "32"
  DB_HOST: "postgresql-service"
  REDIS_HOST: "redis-service"
  INFLUXDB_HOST: "influxdb-service"
  # Redis Streams for messaging (replaces Kafka)
  REDIS_STREAM_TEMPERATURE_DATA: "temperature-data"
  REDIS_STREAM_DEVICE_EVENTS: "device-events"
  REDIS_STREAM_TEMPERATURE_ALERTS: "temperature-alerts"
  MESSAGE_BROKER_TYPE: "redis"
  # Production admin user (will be created on startup if not exists)
  ADMIN_EMAIL: "admin@lab.apj.dev"
  ADMIN_PASSWORD: "GrillStats2024!"
  ADMIN_NAME: "Lab Administrator"