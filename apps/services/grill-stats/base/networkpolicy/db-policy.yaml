apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-access
  namespace: grill-stats
spec:
  podSelector:
    matchLabels:
      app: grill-stats
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: grill-stats-db
    ports:
    - protocol: TCP
      port: 5432