---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grill-stats
  namespace: grill-stats
  labels:
    app: grill-stats
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grill-stats
  template:
    metadata:
      labels:
        app: grill-stats
        component: monitoring
    spec:
      containers:
      - name: grill-stats
        image: lordmuffin/grill-stats:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: THERMOWORKS_API_KEY
          valueFrom:
            secretKeyRef:
              name: grill-stats-secrets
              key: THERMOWORKS_API_KEY
        - name: HOMEASSISTANT_URL
          value: "https://home.andrewpjackson.com"
        - name: HOMEASSISTANT_TOKEN
          valueFrom:
            secretKeyRef:
              name: grill-stats-secrets
              key: HOMEASSISTANT_TOKEN
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: grill-stats-prod-creds-1password
              key: DB_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grill-stats-prod-creds-1password
              key: DB_PASSWORD
        - name: POSTGRES_DB
          value: grill-stats
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@grill-stats-db-rw.grill-stats.svc.cluster.local:5432/$(POSTGRES_DB)
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grill-stats-prod-creds-1password
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@redis.grill-stats.svc.cluster.local:6379/0
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: grill-stats-prod-creds-1password
              key: SECRET_KEY
        - name: FLASK_ENV
          value: development
        - name: SYNC_INTERVAL
          value: "300"
        - name: THERMOWORKS_POLLING_INTERVAL
          value: "300"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: grill-stats
  namespace: grill-stats
  labels:
    app: grill-stats
    component: monitoring
spec:
  selector:
    app: grill-stats
  ports:
  - port: 5000
    targetPort: http
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grill-stats
  namespace: grill-stats
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - grills.lab.apj.dev  # Will be patched by overlay
    secretName: grill-stats-tls
  rules:
  - host: grills.lab.apj.dev  # Will be patched by overlay
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grill-stats
            port:
              number: 5000