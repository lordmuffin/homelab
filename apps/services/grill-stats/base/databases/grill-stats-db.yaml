---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grill-stats-db
  namespace: grill-monitoring
  labels:
    app: grill-stats-db
    component: database
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2-10
  instances: 1
  startDelay: 35
  stopDelay: 35
  resources:
    requests:
      memory: 256Mi
      cpu: 300m
    limits:
      memory: 768Mi
      cpu: 700m
  postgresql:
    parameters:
      shared_buffers: 256MB
      timezone: "America/Chicago"
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'
  bootstrap:
    initdb:
      database: grill-stats
      owner: grill-stats
      secret:
        name: grill-monitoring-db-credentials-1password
  storage:
    storageClass: sata
    size: 20Gi
  monitoring:
    enablePodMonitor: true
  # affinity:
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: kubernetes.io/hostname
    #             operator: In
    #             values:
    #               - node-one

---
apiVersion: v1
kind: Service
metadata:
  name: grill-stats-db
  namespace: grill-monitoring
  labels:
    app: grill-stats-db
    component: database
spec:
  selector:
    app: grill-stats-db
  ports:
  - port: 5432
    targetPort: postgres
    name: postgres
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grill-stats-db-pvc
  namespace: grill-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ssd  # Adjust to match your homelab's storage class