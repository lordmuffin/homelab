---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: blinko
  name: blinko
spec:
  replicas: 1
  strategy: {}
  selector:
    matchLabels:
      app: blinko
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: blinko
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: restore-db-backup
        image: alpine:latest
        env:
        - name: B2_APPLICATION_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: keyID
        - name: B2_APPLICATION_KEY
          valueFrom:
            secretKeyRef:
              name: backblaze-cloud-homelab-creds-1password
              key: applicationKey
        - name: B2_BUCKET_NAME
          value: "cloud-homelab-backups"
        - name: POSTGRES_HOST
          value: blinko-database-rw.blinko.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: blinko
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: blinko-db-postgres-creds-1password
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blinko-db-postgres-creds-1password
              key: password
        - name: FORCE_RESTORE
          value: "false"
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Installing required dependencies..."
          apk add --no-cache postgresql-client curl unzip bash
          
          echo "Validating environment variables..."
          echo "B2_APPLICATION_KEY_ID length: ${#B2_APPLICATION_KEY_ID}"
          echo "B2_APPLICATION_KEY length: ${#B2_APPLICATION_KEY}"
          echo "B2_BUCKET_NAME: $B2_BUCKET_NAME"
          
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "ERROR: B2 credentials not available. Skipping backup restoration."
            exit 0
          fi
          
          echo "Installing B2 CLI..."
          curl -L https://github.com/Backblaze/B2_Command_Line_Tool/releases/latest/download/b2-linux -o /usr/local/bin/b2
          chmod +x /usr/local/bin/b2
          
          echo "Authenticating with B2..."
          /usr/local/bin/b2 authorize-account $B2_APPLICATION_KEY_ID $B2_APPLICATION_KEY
          
          echo "Checking for backups in B2 bucket..."
          echo "Searching for blinko backups in B2..."
          BACKUP_LIST=$(/usr/local/bin/b2 ls "b2://$B2_BUCKET_NAME/blinko/" --recursive 2>/dev/null || echo "")
          
          if [ -z "$BACKUP_LIST" ]; then
            echo "No files found in blinko/ folder. Checking if folder exists..."
            FOLDER_CHECK=$(/usr/local/bin/b2 ls "b2://$B2_BUCKET_NAME" 2>/dev/null | grep "blinko/" || echo "")
            if [ -z "$FOLDER_CHECK" ]; then
              echo "No blinko/ folder found in bucket. No backups available."
            else
              echo "blinko/ folder exists but contains no backup files."
            fi
            echo "Skipping restoration - starting with empty database."
            exit 0
          fi
          
          # Find the latest backup file
          echo "Found backup files, searching for latest..."
          LATEST_BACKUP=$(echo "$BACKUP_LIST" | grep -E 'pg_backup_[0-9]{8}_[0-9]{6}\.sql\.gz' | sort -r | head -n 1 | awk '{print $NF}')
          
          if [ -z "$LATEST_BACKUP" ]; then
            echo "No valid backup files found matching pattern pg_backup_YYYYMMDD_HHMMSS.sql.gz"
            echo "Available files in blinko/ folder:"
            echo "$BACKUP_LIST"
            echo "Skipping restoration - starting with empty database."
            exit 0
          fi
          
          # Strip blinko/ prefix if present
          BACKUP_FILENAME=$(echo "$LATEST_BACKUP" | sed 's|^blinko/||')
          echo "Found latest backup file: $BACKUP_FILENAME"
          echo "Debug - Original: $LATEST_BACKUP, Cleaned: $BACKUP_FILENAME"
          
          # Create temp directory for backup
          mkdir -p /tmp/backup
          
          # Download the backup using B2 CLI
          echo "Downloading backup: $BACKUP_FILENAME"
          echo "B2 CLI version:"
          /usr/local/bin/b2 version
          
          # Try older B2 CLI download syntax first (legacy compatibility)
          echo "Attempting legacy B2 download syntax..."
          if /usr/local/bin/b2 download_file_by_name "$B2_BUCKET_NAME" "blinko/$BACKUP_FILENAME" /tmp/backup/latest.sql.gz 2>/dev/null; then
            echo "Downloaded successfully using legacy syntax"
          else
            echo "Legacy syntax failed, trying modern file download..."
            # Try modern B2 URI format
            BACKUP_URI="b2://$B2_BUCKET_NAME/blinko/$BACKUP_FILENAME"
            if ! /usr/local/bin/b2 file download "$BACKUP_URI" /tmp/backup/latest.sql.gz 2>/dev/null; then
              echo "Both download methods failed. Skipping restoration."
              exit 0
            fi
          fi
          
          echo "Backup downloaded successfully."
          
          # Check database connectivity and if it has data
          echo "Testing database connectivity..."
          if ! PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1;" >/dev/null 2>&1; then
            echo "ERROR: Cannot connect to database at $POSTGRES_HOST. Check database configuration."
            exit 1
          fi
          
          echo "Checking if database contains user data..."
          # Check for actual user content - Blinko uses different table names than Tandoor
          # Check for notes and tags which would indicate user activity
          USER_NOTES=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM notes WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          USER_TAGS=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM tags WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          USER_ACCOUNTS=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM accounts WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
          
          echo "Found $USER_NOTES notes, $USER_TAGS tags, $USER_ACCOUNTS accounts in database"
          
          # Check if restoration should be forced
          if [ "${FORCE_RESTORE:-false}" = "true" ]; then
            echo "⚠️  FORCE_RESTORE=true detected. Proceeding with restoration despite existing user data."
            echo "⚠️  This will overwrite all existing notes, tags, and accounts."
          elif [ "$USER_NOTES" -gt "0" ] || [ "$USER_TAGS" -gt "5" ] || [ "$USER_ACCOUNTS" -gt "0" ]; then
            echo "Database contains user data (notes: $USER_NOTES, accounts: $USER_ACCOUNTS). Skipping restoration to prevent data loss."
            echo "💡 To force restoration, set FORCE_RESTORE=true environment variable."
            exit 0
          fi
          
          echo "Database appears to contain only default/seed data. Proceeding with backup restoration..."
          
          # Validate backup file
          echo "Validating backup file..."
          if [ ! -f /tmp/backup/latest.sql.gz ]; then
            echo "ERROR: Backup file not found after download."
            exit 1
          fi
          
          # Check if file is valid gzip
          if ! gunzip -t /tmp/backup/latest.sql.gz 2>/dev/null; then
            echo "ERROR: Downloaded backup file is corrupted or not a valid gzip file."
            exit 1
          fi
          
          # Clear existing database to avoid conflicts
          echo "Clearing existing database for clean restoration..."
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c "
            DO \$\$ DECLARE
              r RECORD;
            BEGIN
              -- Drop all tables in the public schema
              FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP TABLE IF EXISTS public.' || quote_ident(r.tablename) || ' CASCADE';
              END LOOP;
              
              -- Drop all sequences in the public schema
              FOR r IN (SELECT sequencename FROM pg_sequences WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP SEQUENCE IF EXISTS public.' || quote_ident(r.sequencename) || ' CASCADE';
              END LOOP;
            END \$\$;
          "
          
          echo "Database cleared successfully. Starting restoration..."
          
          # Restore the backup
          echo "Restoring database from backup: $LATEST_BACKUP"
          if gunzip -c /tmp/backup/latest.sql.gz | PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -q; then
            echo "Database restoration completed successfully."
            
            # Verify restoration by checking table count
            RESTORED_TABLES=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/dev/null | tr -d ' ')
            echo "Restored database contains $RESTORED_TABLES tables."
            
            # Check for restored user data
            USER_NOTES_RESTORED=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM notes WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
            USER_ACCOUNTS_RESTORED=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -t -c "SELECT COUNT(*) FROM accounts WHERE id > 0;" 2>/dev/null | tr -d ' ' || echo "0")
            echo "Restored $USER_NOTES_RESTORED notes and $USER_ACCOUNTS_RESTORED accounts from backup."
          else
            echo "ERROR: Database restoration failed."
            exit 1
          fi
      containers:
      - name: blinko
        image: blinkospace/blinko:latest
        imagePullPolicy: Always
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXTAUTH_URL
          value: "https://blinko.labs.andrewpjackson.com"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: blinko-nextauth-secret-1password
              key: password
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USERNAME):$(POSTGRES_PASSWORD)@blinko-database-rw.blinko.svc.cluster.local:5432/blinko"
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: blinko-db-postgres-creds-1password
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blinko-db-postgres-creds-1password
              key: password
        ports:
          - name: web
            containerPort: 1111
            protocol: TCP
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /
            port: 1111
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 1111
          initialDelaySeconds: 15
          periodSeconds: 5