apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-mcp-config
  namespace: mcp-servers
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  # Gitea Configuration
  GITEA_BASE_URL: "http://gitea-internal.gitea.svc.cluster.local:3000"
  GITEA_API_VERSION: "v1"
  GITEA_DEFAULT_OWNER: "admin"
  
  # MCP Server Configuration
  MCP_SERVER_NAME: "gitea-mcp"
  MCP_SERVER_VERSION: "1.0.0"
  MCP_SERVER_DESCRIPTION: "MCP Server for Gitea Integration"
  
  # API Configuration
  API_TIMEOUT: "30000"
  API_RETRY_COUNT: "3"
  API_RETRY_DELAY: "1000"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  
  # Cache Configuration
  CACHE_ENABLED: "true"
  CACHE_TTL: "300"
  
  # Supported Operations
  SUPPORTED_OPERATIONS: |
    repositories:
      - list_repositories
      - get_repository
      - create_repository
      - update_repository
      - delete_repository
    issues:
      - list_issues
      - get_issue
      - create_issue
      - update_issue
      - close_issue
    pull_requests:
      - list_pull_requests
      - get_pull_request
      - create_pull_request
      - update_pull_request
      - merge_pull_request
    commits:
      - list_commits
      - get_commit
      - create_commit
    branches:
      - list_branches
      - get_branch
      - create_branch
      - delete_branch
    files:
      - get_file_content
      - create_file
      - update_file
      - delete_file
    organizations:
      - list_organizations
      - get_organization
    users:
      - get_user
      - list_collaborators
    webhooks:
      - list_webhooks
      - create_webhook
      - delete_webhook
  
  # Claude Code Integration
  claude_code_config: |
    {
      "mcpServers": {
        "gitea": {
          "command": "stdio",
          "args": [],
          "env": {
            "GITEA_BASE_URL": "http://gitea-mcp.mcp-servers.svc.cluster.local:3000",
            "MCP_SERVER_NAME": "gitea-mcp"
          }
        }
      }
    }