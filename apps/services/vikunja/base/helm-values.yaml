vikunja:
  env:
    VIKUNJA_DATABASE_USERNAME:
      valueFrom:
        secretKeyRef:
          name: vikunja-db-postgres-creds-1password
          key: username
    VIKUNJA_DATABASE_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: vikunja-db-postgres-creds-1password
          key: password
    VIKUNJA_DATABASE_HOST:
      value: vikunja-database-rw.vikunja.svc.cluster.local
    VIKUNJA_DATABASE_PORT:
      value: 5432
  persistence:
    data:
      enabled: true
      existingClaim: vikunja-data
postgresql:
  enabled: false
