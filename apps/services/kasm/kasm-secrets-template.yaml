---
# This is a template for creating a custom 1Password item for KASM secrets
# You can use this with the op CLI to create the necessary secret items

# Template for the all-in-one KASM secrets item
# Run: op item template get KASM-Secrets-Template
kasm-secrets-template:
  title: "KASM All-in-one Secrets"
  category: "LOGIN"
  fields:
    - id: "admin-password"
      type: "CONCEALED"
      purpose: "PASSWORD"
      label: "Admin Password"
      value: ""
      
    - id: "db-password"
      type: "CONCEALED"
      purpose: "PASSWORD"
      label: "Database Password" 
      value: ""
      
    - id: "redis-password"
      type: "CONCEALED"
      purpose: "PASSWORD"
      label: "Redis Password"
      value: ""
      
    - id: "encryption-secret"
      type: "CONCEALED"
      purpose: "PASSWORD"
      label: "Encryption Secret"
      value: ""
      
    - id: "manager-token"
      type: "CONCEALED"
      purpose: "PASSWORD"
      label: "Manager Token"
      value: ""
      
    - id: "service-token"
      type: "CONCEALED"
      purpose: "PASSWORD"
      label: "Service Token"
      value: ""
      
    - id: "user-password"
      type: "CONCEALED"
      purpose: "PASSWORD"
      label: "User Password"
      value: ""

# Command to create the item in the HomeLab vault
# op item create --template kasm-secrets-template --vault HomeLab --title "KASM All-in-one Secrets" \
#   admin-password="secure-admin-password" \
#   db-password="secure-db-password" \
#   redis-password="secure-redis-password" \
#   encryption-secret="secure-encryption-key" \
#   manager-token="secure-manager-token" \
#   service-token="secure-service-token" \
#   user-password="secure-user-password"