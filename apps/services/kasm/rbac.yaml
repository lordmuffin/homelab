apiVersion: v1
kind: ServiceAccount
metadata:
  name: kasm-serviceaccount
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kasm-role
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kasm-rolebinding
  namespace: kasm
subjects:
  - kind: ServiceAccount
    name: kasm-serviceaccount
    namespace: kasm
roleRef:
  kind: Role
  name: kasm-role
  apiGroup: rbac.authorization.k8s.io