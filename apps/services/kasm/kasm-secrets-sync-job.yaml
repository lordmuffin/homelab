apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-secrets-sync-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/sync-wave: "2"  # Run early to sync secrets
    argocd.argoproj.io/sync-hook: PostSync
    argocd.argoproj.io/sync-hook-weight: "5"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: kasm-database-operator
      restartPolicy: OnFailure
      containers:
      - name: sync-secrets
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Synchronizing kasm-secrets with kasm-all-in-one-secrets..."
          
          # Get the db-password from kasm-all-in-one-secrets
          DB_PASSWORD=$(kubectl get secret kasm-all-in-one-secrets -n kasm -o jsonpath='{.data.db-password}')
          
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: Could not retrieve db-password from kasm-all-in-one-secrets"
            exit 1
          fi
          
          # Update kasm-secrets to use the same password
          echo "Updating kasm-secrets db-password to match kasm-all-in-one-secrets..."
          kubectl patch secret kasm-secrets -n kasm --type='json' -p="[{\"op\": \"replace\", \"path\": \"/data/db-password\", \"value\": \"$DB_PASSWORD\"}]"
          
          echo "✅ Secrets synchronized successfully!"
          echo "✅ Both kasm-secrets and kasm-all-in-one-secrets now have matching db-password"