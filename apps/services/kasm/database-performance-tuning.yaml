---
# PostgreSQL Performance Tuning ConfigMap for KASM
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-postgres-performance-config
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  postgresql.conf: |
    # PostgreSQL Performance Tuning for KASM Workload
    # Based on system health analysis and KASM requirements
    
    # Memory Configuration
    shared_buffers = 256MB              # 25% of available memory (assuming 1GB pod)
    effective_cache_size = 1GB          # Estimate of OS cache
    work_mem = 4MB                      # Memory for sorts and hash joins
    maintenance_work_mem = 64MB         # Memory for maintenance operations
    
    # Connection Configuration
    max_connections = 200               # Support multiple API instances
    superuser_reserved_connections = 3  # Reserved for admin
    
    # Write-Ahead Logging (WAL) Optimization
    wal_buffers = 16MB                  # WAL buffer size
    checkpoint_completion_target = 0.9   # Spread checkpoint I/O
    checkpoint_timeout = 10min          # Checkpoint frequency
    max_wal_size = 2GB                  # Max WAL size before checkpoint
    min_wal_size = 1GB                  # Min WAL size
    
    # Query Optimizer
    random_page_cost = 1.1              # SSD optimization
    seq_page_cost = 1.0                 # Sequential scan cost
    effective_io_concurrency = 200      # Concurrent I/O operations
    
    # Parallel Query Settings
    max_parallel_workers_per_gather = 2
    max_parallel_workers = 4
    max_parallel_maintenance_workers = 2
    
    # Background Writer
    bgwriter_delay = 200ms              # Background writer delay
    bgwriter_lru_maxpages = 100         # Pages written per round
    bgwriter_lru_multiplier = 2.0       # Multiplier for LRU pages
    
    # Autovacuum Tuning for KASM
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 1min           # Frequent vacuuming for KASM
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    
    # Logging for Performance Monitoring
    log_destination = 'stderr'
    log_min_duration_statement = 1000   # Log slow queries (>1s)
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_temp_files = 10MB               # Log temp files >10MB
    
    # Statistics Collection
    track_activities = on
    track_counts = on
    track_io_timing = on
    track_functions = pl
    
    # Lock Management
    deadlock_timeout = 1s
    max_locks_per_transaction = 64
    
    # KASM-Specific Optimizations
    # These settings are optimized for KASM's session management patterns
    statement_timeout = 300000          # 5 minute statement timeout
    idle_in_transaction_session_timeout = 600000  # 10 minute idle timeout
    
  init-performance.sql: |
    -- KASM Database Performance Initialization
    -- Indexes and optimizations for KASM-specific queries
    
    -- Session management indexes (KASM's most frequent queries)
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_user_id ON sessions(user_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_status ON sessions(status);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_created ON sessions(created);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_expiration ON sessions(expiration);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_kasm_id ON sessions(kasm_id);
    
    -- User management indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_username ON users(username);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_disabled ON users(disabled);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_last_session ON users(last_session);
    
    -- Workspace indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_workspaces_enabled ON workspaces(enabled);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_workspaces_docker_registry ON workspaces(docker_registry);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_workspaces_image_id ON workspaces(image_id);
    
    -- Zone and server indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_zones_zone_name ON zones(zone_name);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_servers_zone_id ON servers(zone_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_servers_enabled ON servers(enabled);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_servers_load_cpu ON servers(cpu_percent);
    
    -- Audit and logging indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_audit_username ON audit(username);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_audit_created ON audit(created);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_audit_action ON audit(action);
    
    -- Composite indexes for common KASM queries
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_user_status ON sessions(user_id, status);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_servers_zone_enabled ON servers(zone_id, enabled);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_disabled_last_session ON users(disabled, last_session);
    
    -- Statistics update for better query planning
    ANALYZE sessions;
    ANALYZE users;
    ANALYZE workspaces;
    ANALYZE zones;
    ANALYZE servers;
    ANALYZE audit;
    
    -- Create extension for better monitoring if not exists
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    
    -- Set up connection pooling hints
    ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';
    
    -- Optimize for KASM's connection patterns
    ALTER SYSTEM SET log_statement = 'ddl';  -- Log DDL for monitoring
    ALTER SYSTEM SET log_min_error_statement = 'ERROR';
    
    SELECT pg_reload_conf();

---
# Job to apply PostgreSQL performance tuning
apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-postgres-performance-tuning-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: kasm-db-tuning
        component: performance
    spec:
      restartPolicy: OnFailure
      containers:
      - name: postgres-tuner
        image: postgres:13-alpine
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-db-postgres-creds
              key: admin-password
        - name: POSTGRES_HOST
          value: "db"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== PostgreSQL Performance Tuning for KASM ==="
          
          # Wait for database to be ready
          echo "Waiting for PostgreSQL to be ready..."
          timeout 120 bash -c 'until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT; do echo "Waiting for PostgreSQL..."; sleep 5; done'
          
          echo "✓ PostgreSQL is ready"
          
          # Apply configuration changes
          echo "Applying performance configuration..."
          
          psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -d $POSTGRES_DB <<EOF
          -- Memory Configuration
          ALTER SYSTEM SET shared_buffers = '256MB';
          ALTER SYSTEM SET effective_cache_size = '1GB';
          ALTER SYSTEM SET work_mem = '4MB';
          ALTER SYSTEM SET maintenance_work_mem = '64MB';
          
          -- Connection Configuration
          ALTER SYSTEM SET max_connections = '200';
          
          -- WAL Configuration
          ALTER SYSTEM SET wal_buffers = '16MB';
          ALTER SYSTEM SET checkpoint_completion_target = '0.9';
          ALTER SYSTEM SET max_wal_size = '2GB';
          ALTER SYSTEM SET min_wal_size = '1GB';
          
          -- Query Optimizer
          ALTER SYSTEM SET random_page_cost = '1.1';
          ALTER SYSTEM SET effective_io_concurrency = '200';
          
          -- Parallel Workers
          ALTER SYSTEM SET max_parallel_workers_per_gather = '2';
          ALTER SYSTEM SET max_parallel_workers = '4';
          
          -- Autovacuum Tuning
          ALTER SYSTEM SET autovacuum_naptime = '1min';
          ALTER SYSTEM SET autovacuum_vacuum_scale_factor = '0.1';
          ALTER SYSTEM SET autovacuum_analyze_scale_factor = '0.05';
          
          -- Logging
          ALTER SYSTEM SET log_min_duration_statement = '1000';
          ALTER SYSTEM SET log_checkpoints = 'on';
          ALTER SYSTEM SET log_lock_waits = 'on';
          ALTER SYSTEM SET track_io_timing = 'on';
          
          -- KASM-specific timeouts
          ALTER SYSTEM SET statement_timeout = '300000';
          ALTER SYSTEM SET idle_in_transaction_session_timeout = '600000';
          
          -- Reload configuration
          SELECT pg_reload_conf();
          EOF
          
          echo "✓ Configuration applied"
          
          # Switch to KASM database for index creation
          echo "Creating performance indexes on KASM database..."
          
          # Wait for KASM database to exist
          timeout 60 bash -c 'until psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U kasmapp -d kasm -c "SELECT 1;" >/dev/null 2>&1; do echo "Waiting for KASM database..."; sleep 5; done'
          
          # Apply KASM-specific optimizations
          export PGPASSWORD_KASM=$(kubectl get secret kasm-db-postgres-creds -n kasm -o jsonpath='{.data.db-password}' | base64 -d)
          PGPASSWORD=$PGPASSWORD_KASM psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U kasmapp -d kasm <<EOF
          -- Session management indexes (most critical for KASM performance)
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_user_id ON sessions(user_id);
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_status ON sessions(status);
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_created ON sessions(created);
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_user_status ON sessions(user_id, status);
          
          -- User management indexes
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_username ON users(username);
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_disabled ON users(disabled);
          
          -- Workspace indexes
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_workspaces_enabled ON workspaces(enabled);
          
          -- Zone and server indexes
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_servers_zone_id ON servers(zone_id);
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_servers_enabled ON servers(enabled);
          
          -- Update statistics for better query planning
          ANALYZE sessions;
          ANALYZE users;
          ANALYZE workspaces;
          ANALYZE servers;
          
          -- Show index creation results
          \di
          EOF
          
          echo "✅ PostgreSQL performance tuning completed successfully!"
          
          # Show final configuration
          psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -d $POSTGRES_DB -c "
          SELECT name, setting, unit, context 
          FROM pg_settings 
          WHERE name IN (
            'shared_buffers', 'effective_cache_size', 'work_mem', 
            'max_connections', 'random_page_cost', 'autovacuum_naptime'
          );"
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# PostgreSQL monitoring ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kasm-postgres-monitor
  namespace: kasm
  labels:
    app: kasm-db
    component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kasm-db
  endpoints:
  - port: postgres
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics

---
# Database performance alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kasm-database-performance-alerts
  namespace: kasm
  labels:
    app: kasm-db
    component: alerting
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
  - name: kasm.database.performance
    interval: 30s
    rules:
    - alert: KASMDatabaseHighConnections
      expr: pg_stat_database_numbackends{datname="kasm"} > 150
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "KASM database high connection count"
        description: "KASM database has {{ $value }} connections (threshold: 150)"
    
    - alert: KASMDatabaseSlowQueries
      expr: rate(pg_stat_database_tup_fetched{datname="kasm"}[5m]) / rate(pg_stat_database_tup_returned{datname="kasm"}[5m]) < 0.8
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "KASM database inefficient queries"
        description: "KASM database query efficiency is low: {{ $value | humanizePercentage }}"
    
    - alert: KASMDatabaseLockWaits
      expr: pg_stat_database_conflicts{datname="kasm"} > 0
      for: 1m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "KASM database lock conflicts"
        description: "KASM database experiencing lock conflicts: {{ $value }}"