apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-db-init-fix-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: db-is-ready
        image: kasmweb/api:1.17.0
        command:
        - /bin/bash
        - -c
        - |
          while ! pg_isready -h db -p 5432 -t 10; do 
            echo "Waiting for DB..."; 
            sleep 5; 
          done
      containers:
      - name: kasm-db-init-container
        image: kasmweb/api:1.17.0
        command:
        - /bin/bash
        - -c
        - |
          # Create a psql command that disables SSL
          function psql_no_ssl {
            PGPASSWORD="$POSTGRES_PASSWORD" psql -U kasmapp -d kasm -h db -v sslmode=disable "$@"
          }

          # First check if zones table exists
          if ! psql_no_ssl -c "SELECT 1 FROM zones LIMIT 1" &>/dev/null; then
            echo "Zones table doesn't exist, initializing database..."
            # Create necessary tables directly
            psql_no_ssl -c "CREATE TABLE IF NOT EXISTS zones (zone_id UUID PRIMARY KEY, zone_name VARCHAR(255) NOT NULL, upstream_auth_address VARCHAR(255), default_zone BOOLEAN);"
            
            # Insert two example zone records
            psql_no_ssl -c "INSERT INTO zones (zone_id, zone_name, default_zone) VALUES ('00000000-0000-0000-0000-000000000000', 'Default', true), ('11111111-1111-1111-1111-111111111111', 'Secondary', false);"
            
            echo "Zones table created with required records"
            
            # Also create other required tables like settings if possible
            psql_no_ssl -c "CREATE TABLE IF NOT EXISTS settings (setting_id UUID PRIMARY KEY, name VARCHAR(255) NOT NULL, category VARCHAR(255) NOT NULL, value TEXT);"
            echo "Database initialization completed"
          else
            count=$(psql_no_ssl -t -c "SELECT COUNT(*) FROM zones" 2>/dev/null)
            echo "Found $count zones records"
            if [ "$count" -lt 2 ]; then
              echo "Not enough zones records, adding required records..."
              # Insert two example zone records
              psql_no_ssl -c "INSERT INTO zones (zone_id, zone_name, default_zone) VALUES ('00000000-0000-0000-0000-000000000000', 'Default', true), ('11111111-1111-1111-1111-111111111111', 'Secondary', false);"
              echo "Database initialization completed"
            else
              echo "Database already properly initialized."
            fi
          fi
        env:
        - name: DEFAULT_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-all-in-one-secrets
              key: admin-password
        - name: DEFAULT_MANAGER_TOKEN
          valueFrom:
            secretKeyRef:
              name: kasm-all-in-one-secrets
              key: manager-token
        - name: DEFAULT_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: kasm-all-in-one-secrets
              key: service-token
        - name: DEFAULT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-all-in-one-secrets
              key: user-password
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-all-in-one-secrets
              key: db-password
        volumeMounts:
        - name: db-init-script
          mountPath: /usr/bin/startup.sh
          subPath: startup.sh
      volumes:
      - name: db-init-script
        configMap:
          name: kasm-db-init-startup
          defaultMode: 0755