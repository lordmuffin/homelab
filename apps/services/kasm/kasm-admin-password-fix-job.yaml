apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-admin-password-fix-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/sync-wave: "8"  # Run after all other database jobs
    argocd.argoproj.io/sync-hook: PostSync
    argocd.argoproj.io/sync-hook-weight: "25"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: kasm-database-operator
      restartPolicy: OnFailure
      containers:
      - name: password-fix
        image: postgres:15-alpine
        env:
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-database-postgres-creds
              key: password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-admin-creds
              key: password
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Starting admin password hash correction..."
          
          # Wait for database to be ready
          echo "Waiting for database pod to be ready..."
          while ! kubectl get pod -l cnpg.io/cluster=kasm-database -n kasm --field-selector=status.phase=Running >/dev/null 2>&1; do
            echo "Waiting for database pod..."
            sleep 10
          done
          
          # Get the current admin user's salt from database
          echo "Getting current admin user salt from database..."
          ADMIN_SALT=$(kubectl exec -i deployment/kasm-database -n kasm -- env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql -U postgres -d kasm -t -c "SELECT salt FROM users WHERE username = 'admin@kasm.local';" | tr -d ' ')
          
          if [ -z "$ADMIN_SALT" ]; then
            echo "ERROR: Could not retrieve admin user salt from database"
            exit 1
          fi
          
          echo "Found admin salt: $ADMIN_SALT"
          
          # Generate correct password hash using admin password + salt
          CORRECT_HASH=$(printf "${ADMIN_PASSWORD}${ADMIN_SALT}" | sha256sum | cut -c-64)
          echo "Generated hash: $CORRECT_HASH"
          
          # Update the admin user password hash and unlock account
          echo "Updating admin user password hash and unlocking account..."
          kubectl exec -i deployment/kasm-database -n kasm -- env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql -U postgres -d kasm -c "
            UPDATE users SET 
              pw_hash = '$CORRECT_HASH',
              locked = false,
              failed_pw_attempts = 0
            WHERE username = 'admin@kasm.local';
          " || {
            echo "ERROR: Failed to update admin password hash"
            exit 1
          }
          
          # Verify the update
          echo "Verifying admin account status..."
          kubectl exec -i deployment/kasm-database -n kasm -- env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql -U postgres -d kasm -c "
            SELECT username, locked, disabled, failed_pw_attempts 
            FROM users 
            WHERE username = 'admin@kasm.local';
          "
          
          echo "✅ Admin password hash corrected successfully!"
          echo "✅ Admin account unlocked and reset"
          echo "🎯 Admin login should now work with password from kasm-admin-creds secret"
          
      - name: kubectl
        image: bitnami/kubectl:latest
        command: ["/bin/sleep", "infinity"]