apiVersion: batch/v1
kind: Job
metadata:
  name: copy-secret-data
  namespace: kasm
spec:
  template:
    spec:
      serviceAccountName: kasm-secret-sync-v2
      restartPolicy: OnFailure
      containers:
      - name: secret-copier
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          echo "Copying secret data..."
          # Get the original secret and create the alias
          kubectl get secret kasm-db-postgres-creds -n kasm -o json | \
            jq '.metadata.name = "kasm-database-postgres-creds" | 
                del(.metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.ownerReferences)' | \
            kubectl apply -f -
          echo "Secret data copied successfully!"
          kubectl get secret kasm-database-postgres-creds -n kasm