---
# KASM Performance Optimization Patches
# Addresses critical bottlenecks identified in system health analysis

apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-performance-config
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # Database connection pool optimization
  database-pool.conf: |
    DATABASE_POOL_SIZE=20
    DATABASE_POOL_OVERFLOW=30
    DATABASE_POOL_TIMEOUT=30
    DATABASE_POOL_RECYCLE=3600
    DATABASE_POOL_PRE_PING=true
    DATABASE_POOL_RESET_ON_RETURN=commit
  
  # Redis optimization
  redis-perf.conf: |
    REDIS_MAX_CONNECTIONS=100
    REDIS_CACHE_TTL=3600
    REDIS_SESSION_TTL=86400
    REDIS_TIMEOUT=30
  
  # API performance tuning
  api-performance.conf: |
    API_WORKER_PROCESSES=4
    API_WORKER_CONNECTIONS=1000
    API_KEEPALIVE_TIMEOUT=65
    API_CLIENT_MAX_BODY_SIZE=100M
    API_PROXY_READ_TIMEOUT=300
    API_PROXY_CONNECT_TIMEOUT=60

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasm-api-deployment-performance-patch
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: "Replace=true"
spec:
  replicas: 2  # Start with 2 replicas for HA
  selector:
    matchLabels:
      app.kubernetes.io/name: kasm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasm-api
        version: performance-optimized
    spec:
      # Add resource management
      serviceAccountName: kasm-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      - name: db-is-ready
        image: postgres:13-alpine
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-db-postgres-creds
              key: db-password
        command:
        - /bin/bash
        - -c
        args:
        - |
          set -e
          export PGPASSWORD=$POSTGRES_PASSWORD
          
          # Enhanced init container with exponential backoff
          MAX_ATTEMPTS=10
          DELAY=2
          ATTEMPT=1
          
          echo "=== Enhanced DB Readiness Check ==="
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking database..."
            
            # Test basic connection
            if psql -h db -U kasmapp -d postgres -c "SELECT 1;" >/dev/null 2>&1; then
              echo "✓ Database connection successful"
              
              # Test KASM database exists
              if psql -h db -U kasmapp -d kasm -c "SELECT 1;" >/dev/null 2>&1; then
                echo "✓ KASM database accessible"
                
                # Test required tables (more comprehensive)
                ZONE_COUNT=$(psql -h db -U kasmapp -d kasm -t -c "SELECT COUNT(*) FROM zones;" 2>/dev/null || echo "0")
                if [ "$ZONE_COUNT" -ge 1 ]; then
                  echo "✅ Database fully initialized with $ZONE_COUNT zones"
                  exit 0
                else
                  echo "⚠️ Database exists but not initialized (zones: $ZONE_COUNT)"
                fi
              else
                echo "⚠️ KASM database not accessible"
              fi
            else
              echo "❌ Database connection failed"
            fi
            
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "💥 Failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            
            echo "⏳ Waiting ${DELAY}s before retry..."
            sleep $DELAY
            
            # Exponential backoff (max 60s)
            DELAY=$((DELAY * 2))
            if [ $DELAY -gt 60 ]; then
              DELAY=60
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done

      containers:
      - name: kasm-api-container
        image: kasmweb/api:1.15.0  # Ensure consistent image version
        
        # CRITICAL: Enhanced resource allocation
        resources:
          requests:
            memory: "512Mi"     # Sufficient for startup
            cpu: "250m"         # 25% CPU minimum
          limits:
            memory: "2Gi"       # Allow burst for heavy operations
            cpu: "1000m"        # 100% CPU maximum
        
        # Performance-optimized environment
        env:
        - name: START_SERVICES
          value: "true"
        - name: KUBERNETES_SERVICE_HOST
          value: "true"
        
        # Database configuration with connection pooling
        - name: DATABASE_HOSTNAME
          value: "db"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "kasm"
        - name: DATABASE_USERNAME
          value: "kasmapp"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-db-postgres-creds
              key: db-password
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-db-postgres-creds
              key: db-password
        - name: POSTGRES_HOST
          value: "db"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "kasm"
        
        # Database connection pool optimization
        - name: DATABASE_POOL_SIZE
          value: "20"
        - name: DATABASE_POOL_OVERFLOW
          value: "30"
        - name: DATABASE_POOL_TIMEOUT
          value: "30"
        - name: DATABASE_POOL_RECYCLE
          value: "3600"
        - name: DATABASE_POOL_PRE_PING
          value: "true"
        
        # Redis configuration
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-secrets
              key: redis-password
        - name: REDIS_MAX_CONNECTIONS
          value: "100"
        - name: REDIS_TIMEOUT
          value: "30"
        
        # Security configuration
        - name: INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: kasm-secrets
              key: encryption-secret
        
        # Logging optimization
        - name: LOG_LEVEL
          value: "INFO"  # Reduce from DEBUG if set
        - name: LOG_CONFIG_FILE
          value: "/opt/kasm/current/conf/app/api.logging.yaml"
        
        # Performance tuning
        - name: API_SERVER_ID
          value: "kasm-api-1"
        - name: API_WORKER_PROCESSES
          value: "4"
        - name: API_WORKER_CONNECTIONS
          value: "1000"
        
        # Circuit breaker configuration
        - name: DB_CIRCUIT_BREAKER_ENABLED
          value: "true"
        - name: DB_CIRCUIT_BREAKER_FAILURE_THRESHOLD
          value: "5"
        - name: DB_CIRCUIT_BREAKER_RECOVERY_TIMEOUT
          value: "30"
        
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        
        # Enhanced health checks with proper timeouts
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30      # Allow proper startup time
          periodSeconds: 10            # Check every 10 seconds
          timeoutSeconds: 30           # 30 second timeout
          failureThreshold: 3          # 3 failures = not ready
          successThreshold: 1          # 1 success = ready
        
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60      # Allow full startup
          periodSeconds: 30            # Check every 30 seconds
          timeoutSeconds: 30           # Match readiness timeout
          failureThreshold: 5          # More tolerant than readiness
        
        # Startup probe for slow-starting containers
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 30         # Allow up to 5 minutes for startup
        
        # Volume mounts for configuration
        volumeMounts:
        - name: performance-config
          mountPath: /opt/kasm/conf/performance
          readOnly: true
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: performance-config
        configMap:
          name: kasm-performance-config
      
      # Enhanced pod-level settings
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      
      # Pod disruption budget support
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - kasm-api
              topologyKey: kubernetes.io/hostname

---
# Horizontal Pod Autoscaler for performance scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kasm-api-hpa
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kasm-api-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# Pod Disruption Budget for reliability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kasm-api-pdb
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kasm-api

---
# ServiceMonitor for performance monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kasm-performance-monitor
  namespace: kasm
  labels:
    app: kasm
    component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kasm-api
  endpoints:
  - port: http
    path: /api/metrics
    interval: 15s
    scrapeTimeout: 10s
  - port: http
    path: /api/health
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: up
      targetLabel: kasm_health_status

---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kasm-performance-alerts
  namespace: kasm
  labels:
    app: kasm
    component: alerting
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
  - name: kasm.performance
    interval: 30s
    rules:
    # Critical Alerts
    - alert: KASMAPIDown
      expr: up{job="kasm-api"} == 0
      for: 1m
      labels:
        severity: critical
        component: api
      annotations:
        summary: "KASM API is completely down"
        description: "KASM API has been down for more than 1 minute"
        runbook_url: "https://github.com/homelab/kasm/docs/runbooks/api-down.md"
    
    - alert: KASMHighRestartRate
      expr: increase(kube_pod_container_status_restarts_total{namespace="kasm",container="kasm-api-container"}[5m]) > 2
      for: 2m
      labels:
        severity: critical
        component: api
      annotations:
        summary: "High container restart rate in KASM API"
        description: "KASM API containers restarting frequently: {{ $value }} restarts in 5 minutes"
    
    - alert: KASMDatabaseConnectionFailure
      expr: kasm_database_connection_errors_total > 10
      for: 1m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "KASM database connection failures"
        description: "High database connection failure rate: {{ $value }} failures"
    
    # Warning Alerts
    - alert: KASMHighLatency
      expr: histogram_quantile(0.95, rate(kasm_http_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "KASM API high latency"
        description: "KASM API P95 latency is {{ $value }}s (threshold: 2s)"
    
    - alert: KASMHighMemoryUsage
      expr: container_memory_usage_bytes{namespace="kasm",container="kasm-api-container"} / container_spec_memory_limit_bytes > 0.85
      for: 5m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "KASM API high memory usage"
        description: "KASM API memory usage is {{ $value | humanizePercentage }} (threshold: 85%)"
    
    - alert: KASMHighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{namespace="kasm",container="kasm-api-container"}[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "KASM API high CPU usage"
        description: "KASM API CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"
    
    - alert: KASMPodNotReady
      expr: kube_pod_status_ready{namespace="kasm",condition="false"} == 1
      for: 10m
      labels:
        severity: warning
        component: pod
      annotations:
        summary: "KASM pod not ready"
        description: "Pod {{ $labels.pod }} has been not ready for more than 10 minutes"