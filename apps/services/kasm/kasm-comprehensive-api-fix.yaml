apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-comprehensive-api-fix-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: "35"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: kasm-api-fix
        component: comprehensive
    spec:
      restartPolicy: OnFailure
      containers:
      - name: comprehensive-api-fixer
        image: postgres:13
        env:
        - name: POSTGRES_HOST
          value: "db"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "kasm"
        - name: POSTGRES_USER
          value: "kasmapp"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-database-postgres-creds
              key: db-password
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== KASM Comprehensive API Fix ==="
          
          # Create missing tables that the API expects
          echo "Creating missing KASM tables..."
          
          psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -d $POSTGRES_DB << 'EOSQL'
          
          -- Create sessions table if it doesn't exist
          CREATE TABLE IF NOT EXISTS sessions (
              session_id SERIAL PRIMARY KEY,
              user_id INTEGER REFERENCES users(user_id),
              zone_id UUID REFERENCES zones(zone_id),
              session_token VARCHAR(512),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              expires_at TIMESTAMP,
              status VARCHAR(50) DEFAULT 'active'
          );
          
          -- Create workspaces table if it doesn't exist
          CREATE TABLE IF NOT EXISTS workspaces (
              workspace_id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              friendly_name VARCHAR(255),
              description TEXT,
              docker_registry VARCHAR(255),
              docker_image VARCHAR(255),
              enabled INTEGER DEFAULT 1,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          -- Create workspace_registry table if it doesn't exist
          CREATE TABLE IF NOT EXISTS workspace_registry (
              registry_id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL UNIQUE,
              hostname VARCHAR(255) NOT NULL,
              username VARCHAR(255),
              password VARCHAR(255),
              enabled INTEGER DEFAULT 1,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          -- Create kasm_agents table (often expected by KASM API)
          CREATE TABLE IF NOT EXISTS kasm_agents (
              agent_id SERIAL PRIMARY KEY,
              hostname VARCHAR(255) NOT NULL,
              agent_type VARCHAR(50) DEFAULT 'kasm',
              enabled INTEGER DEFAULT 1,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          
          -- Insert default workspace registry entries
          INSERT INTO workspace_registry (name, hostname, enabled) VALUES 
              ('Docker Hub', 'registry-1.docker.io', 1),
              ('Local Registry', 'localhost:5000', 0)
          ON CONFLICT (name) DO NOTHING;
          
          -- Insert a basic workspace for testing
          INSERT INTO workspaces (name, friendly_name, docker_registry, docker_image, enabled) VALUES 
              ('Ubuntu Desktop', 'Ubuntu Desktop Environment', 'registry-1.docker.io', 'kasmweb/ubuntu-focal-desktop:1.12.0', 1)
          ON CONFLICT DO NOTHING;
          
          -- Ensure critical settings for API startup
          INSERT INTO settings (name, title, value, value_type, category, description) VALUES 
              ('api_server_url', 'API Server URL', 'http://kasm-api-service:8080', 'string', 'api', 'API server URL'),
              ('manager_hostname', 'Manager Hostname', 'kasm-manager-service', 'string', 'manager', 'Manager service hostname'),
              ('database_ssl', 'Database SSL', '0', 'boolean', 'database', 'Enable SSL for database connections'),
              ('default_desktop_resolution', 'Default Desktop Resolution', '1280x720', 'string', 'desktop', 'Default desktop resolution'),
              ('session_cleanup_interval', 'Session Cleanup Interval', '300', 'integer', 'session', 'Session cleanup interval in seconds'),
              ('enable_uploads', 'Enable Uploads', '1', 'boolean', 'upload', 'Enable file upload functionality'),
              ('enable_downloads', 'Enable Downloads', '1', 'boolean', 'download', 'Enable file download functionality'),
              ('connection_proxy_port', 'Connection Proxy Port', '8080', 'integer', 'proxy', 'Connection proxy port'),
              ('redis_ssl', 'Redis SSL', '0', 'boolean', 'redis', 'Enable SSL for Redis connections'),
              ('licensing_enabled', 'Licensing Enabled', '0', 'boolean', 'licensing', 'Enable license checking'),
              ('auto_login_enabled', 'Auto Login Enabled', '0', 'boolean', 'auth', 'Enable automatic login'),
              ('default_zone_id', 'Default Zone ID', (SELECT zone_id FROM zones LIMIT 1), 'string', 'zone', 'Default zone identifier')
          ON CONFLICT (name) DO UPDATE SET 
              value = EXCLUDED.value,
              updated_at = CURRENT_TIMESTAMP;
          
          -- Create a test admin user with unencrypted password for initial access
          INSERT INTO users (username, email, pw_hash, salt, locked, disabled) VALUES 
              ('admin', 'admin@kasm.local', 'admin123', 'salt123', false, false)
          ON CONFLICT (username) DO UPDATE SET 
              pw_hash = 'admin123',
              salt = 'salt123',
              locked = false,
              disabled = false;
          
          -- Grant all necessary permissions
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO kasmapp;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO kasmapp;
          
          -- Create indexes for performance
          CREATE INDEX IF NOT EXISTS idx_sessions_user_id ON sessions(user_id);
          CREATE INDEX IF NOT EXISTS idx_sessions_zone_id ON sessions(zone_id);
          CREATE INDEX IF NOT EXISTS idx_sessions_token ON sessions(session_token);
          CREATE INDEX IF NOT EXISTS idx_workspaces_enabled ON workspaces(enabled);
          CREATE INDEX IF NOT EXISTS idx_users_username ON users(username);
          CREATE INDEX IF NOT EXISTS idx_settings_name ON settings(name);
          CREATE INDEX IF NOT EXISTS idx_settings_category ON settings(category);
          
          -- Final verification
          SELECT 'Database setup completed' as status;
          SELECT 'Tables created:' as info;
          SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;
          
          SELECT 'Total settings:' as info, COUNT(*) as count FROM settings;
          SELECT 'Total users:' as info, COUNT(*) as count FROM users;
          SELECT 'Total zones:' as info, COUNT(*) as count FROM zones;
          SELECT 'Total workspaces:' as info, COUNT(*) as count FROM workspaces;
          
          EOSQL
          
          echo "✅ Comprehensive database fix completed!"
          echo "API should now have all required tables and data to start successfully."