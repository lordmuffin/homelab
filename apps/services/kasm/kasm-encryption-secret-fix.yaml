apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-encryption-secret-fix-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: "20"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: kasm-secret-fix
        component: encryption
    spec:
      serviceAccountName: kasm-secret-sync
      restartPolicy: OnFailure
      containers:
      - name: encryption-secret-fixer
        image: bitnami/kubectl:latest
        env:
        - name: NAMESPACE
          value: "kasm"
        - name: SECRET_NAME
          value: "kasm-database-postgres-creds"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== KASM Encryption Secret Fix ==="
          
          # Generate a proper 32-byte encryption key (base64 encoded)
          echo "Generating new encryption secret..."
          NEW_ENCRYPTION_SECRET=$(openssl rand -base64 32)
          echo "New encryption secret generated (32 bytes base64 encoded)"
          
          # Update the secret with the new encryption secret
          echo "Updating secret with new encryption secret..."
          kubectl patch secret $SECRET_NAME -n $NAMESPACE --type='merge' --patch="{
            \"data\": {
              \"encryption-secret\": \"$(echo -n "$NEW_ENCRYPTION_SECRET" | base64 -w 0)\"
            }
          }"
          
          # Verify the secret was updated
          echo "Verifying encryption secret update..."
          UPDATED_SECRET=$(kubectl get secret $SECRET_NAME -n $NAMESPACE -o jsonpath='{.data.encryption-secret}' | base64 -d)
          if [ ${#UPDATED_SECRET} -eq 44 ]; then
            echo "✅ Encryption secret successfully updated (44 characters base64)"
          else
            echo "❌ Encryption secret update failed (${#UPDATED_SECRET} characters)"
            exit 1
          fi
          
          # Store the encryption secret in the database settings as well
          echo "Updating database with new encryption secret..."
          DB_PASSWORD=$(kubectl get secret $SECRET_NAME -n $NAMESPACE -o jsonpath='{.data.db-password}' | base64 -d)
          
          # Connect to database and update encryption settings
          kubectl run temp-psql-client --rm -i --restart=Never --image=postgres:13 --env="PGPASSWORD=$DB_PASSWORD" -- \
            psql -h db -U kasmapp -d kasm -c "
              INSERT INTO settings (name, title, value, category, description) VALUES 
                ('encryption_key', 'Encryption Key', '$NEW_ENCRYPTION_SECRET', 'security', 'Database encryption key for sensitive data')
              ON CONFLICT (name) DO UPDATE SET 
                value = EXCLUDED.value,
                updated_at = CURRENT_TIMESTAMP;
              
              SELECT 'Encryption key updated in database' as status;
            " 2>/dev/null || echo "Database update failed, but secret was updated"
          
          echo "✅ Encryption secret fix completed!"
          echo "Note: API deployment will need to restart to pick up the new secret."