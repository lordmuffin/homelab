apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-secret-sync-job-v2
  namespace: kasm
  labels:
    app: kasm
    component: secret-sync
    version: "v2"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "0"
spec:
  template:
    metadata:
      labels:
        app: kasm
        component: secret-sync
        version: "v2"
    spec:
      serviceAccountName: kasm-secret-sync-v2
      restartPolicy: OnFailure
      containers:
      - name: secret-sync
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - |
          set -e
          echo "Starting KASM secret synchronization v2..."
          
          # Check if both secrets exist
          if ! kubectl get secret kasm-secrets -n kasm >/dev/null 2>&1; then
            echo "ERROR: kasm-secrets not found!"
            exit 1
          fi
          
          if ! kubectl get secret kasm-db-postgres-creds -n kasm >/dev/null 2>&1; then
            echo "ERROR: kasm-db-postgres-creds not found!"
            exit 1
          fi
          
          # Get passwords from both secrets
          KASM_SECRET_PASSWORD=$(kubectl get secret kasm-secrets -n kasm -o jsonpath='{.data.db-password}' | base64 -d)
          DB_CREDS_PASSWORD=$(kubectl get secret kasm-db-postgres-creds -n kasm -o jsonpath='{.data.password}' | base64 -d)
          
          echo "Comparing secret values..."
          
          if [ "$KASM_SECRET_PASSWORD" = "$DB_CREDS_PASSWORD" ]; then
            echo "✅ Secrets are already synchronized"
            exit 0
          fi
          
          echo "⚠️  Secret mismatch detected - synchronizing..."
          echo "Using kasm-secrets as master source..."
          
          # Update kasm-db-postgres-creds to match kasm-secrets
          kubectl patch secret kasm-db-postgres-creds -n kasm --type='merge' -p="{\"data\":{\"password\":\"$(kubectl get secret kasm-secrets -n kasm -o jsonpath='{.data.db-password}')\"}}"
          
          # Verify synchronization
          UPDATED_PASSWORD=$(kubectl get secret kasm-db-postgres-creds -n kasm -o jsonpath='{.data.password}' | base64 -d)
          
          if [ "$KASM_SECRET_PASSWORD" = "$UPDATED_PASSWORD" ]; then
            echo "✅ Secret synchronization completed successfully"
          else
            echo "❌ Secret synchronization failed"
            exit 1
          fi
          
          echo "KASM secret synchronization v2 completed!"

