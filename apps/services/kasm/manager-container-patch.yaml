apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasm-manager-deployment
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/sync-wave: "7"  # Run after database setup jobs
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-hook: Sync
    argocd.argoproj.io/sync-hook-weight: "10"
spec:
  template:
    spec:
      containers:
      - name: kasm-manager-container
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-all-in-one-secrets  # Use consistent secret
              key: db-password
        - name: DATABASE_USER  # Force manager to use kasm user instead of kasmapp
          value: "kasm"
        - name: POSTGRES_USER  # Force manager to use kasm user instead of kasmapp
          value: "kasm"
        # Updated probe delays for proper startup time
        livenessProbe:
          initialDelaySeconds: 120  # Increased from 30s
        readinessProbe:
          initialDelaySeconds: 120  # Increased from 10s