apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasm-api-deployment
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-hook: Sync
    argocd.argoproj.io/sync-hook-weight: "10"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kasm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasm-api
    spec:
      initContainers:
      - name: db-is-ready
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-db-postgres-creds
              key: password
        command:
        - /bin/bash
        - -c
        args:
        - |
          while [ ! $(PGPASSWORD=$POSTGRES_PASSWORD psql -U kasm -d kasm -h kasm-database-rw -t -c "select zone_id from zones" 2>/dev/null | wc -l) -ge 2 ]; do 
            echo "Waiting for DB to initialize..."; 
            sleep 5; 
          done
      containers:
      - name: kasm-api-container
        env:
        - name: START_SERVICES
          value: "true"
        - name: KUBERNETES_SERVICE_HOST
          value: "true"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-db-postgres-creds
              key: password
        # Updated readiness probe timeout for better reliability
        readinessProbe:
          timeoutSeconds: 30  # Increased from 10s