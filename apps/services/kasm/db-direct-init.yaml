apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-db-direct-init-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: db-is-ready
        image: kasmweb/api:1.17.0
        command:
        - /bin/bash
        - -c
        - |
          while ! pg_isready -h db -p 5432 -t 10; do 
            echo "Waiting for DB..."; 
            sleep 5; 
          done
      containers:
      - name: db-init-container
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          # Connect to the database pod directly and run SQL commands
          kubectl exec -n kasm kasm-db-statefulset-0 -- bash -c '
            # Check if zones table exists
            if ! psql -U kasmapp -d kasm -c "SELECT 1 FROM information_schema.tables WHERE table_name = '\''zones'\''" | grep -q 1; then
              echo "Creating zones table..."
              psql -U kasmapp -d kasm -c "CREATE TABLE zones (zone_id UUID PRIMARY KEY, zone_name VARCHAR(255) NOT NULL, upstream_auth_address VARCHAR(255), default_zone BOOLEAN);"
              echo "Inserting zone records..."
              psql -U kasmapp -d kasm -c "INSERT INTO zones (zone_id, zone_name, default_zone) VALUES ('\''00000000-0000-0000-0000-000000000000'\'', '\''Default'\'', true), ('\''11111111-1111-1111-1111-111111111111'\'', '\''Secondary'\'', false);"
            else
              echo "Zones table already exists"
              # Check if we have enough zone records
              count=$(psql -U kasmapp -d kasm -t -c "SELECT COUNT(*) FROM zones" | tr -d "\\n ") 
              echo "Found $count zones records"
              if [ "$count" -lt 2 ]; then
                echo "Adding more zone records..."
                psql -U kasmapp -d kasm -c "INSERT INTO zones (zone_id, zone_name, default_zone) VALUES ('\''00000000-0000-0000-0000-000000000000'\'', '\''Default'\'', true), ('\''11111111-1111-1111-1111-111111111111'\'', '\''Secondary'\'', false);"
              fi
            fi
            
            # Check if settings table exists
            if ! psql -U kasmapp -d kasm -c "SELECT 1 FROM information_schema.tables WHERE table_name = '\''settings'\''" | grep -q 1; then
              echo "Creating settings table..."
              psql -U kasmapp -d kasm -c "CREATE TABLE settings (setting_id UUID PRIMARY KEY, name VARCHAR(255) NOT NULL, category VARCHAR(255) NOT NULL, value TEXT);"
            else
              echo "Settings table already exists"
            fi
            
            echo "Database initialization completed successfully"
          '
      serviceAccountName: kasm-serviceaccount