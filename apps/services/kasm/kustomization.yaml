apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: kasm

# Common annotations applied to all resources
commonAnnotations:
  # Managed by ArgoCD unified application
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: kasm-unified

resources:
  # Wave -1: Prerequisites (secrets only - PVCs and RBAC managed by Helm)
  - onepassword-items.yaml
  - secrets.yaml
  - base/db.yaml
  
  # Wave 0: ConfigMap fixes (before Helm deployment)
  - rdp-gateway-configmap-fix.yaml
  
  # Wave 0: Core application resources (handled by Helm)
  # Helm chart resources are deployed automatically with wave 0
  
  # Wave 1: Custom routing and ingress
  - ingressroute.yaml  # Keep IngressRoute for Traefik-specific routing
  
  # Wave 1: Secret synchronization (PreSync)
  - kasm-secret-sync-rbac.yaml
  - kasm-secret-sync-job-v2.yaml
  
  # Wave 2: Database initialization jobs
  - api-init-job.yaml
  - api-direct-fix.yaml
  - db-label-job.yaml
  - kasm-db-user-setup-job.yaml
  - kasm-db-permissions-job.yaml
  - kasm-db-init-configmap.yaml
  - kasm-db-init-job-v2.yaml
  
  # Wave 3: Application configuration jobs
  - kasm-db-complete-init-job.yaml
  - kasm-secrets-sync-job.yaml
  
  # Wave 4: Post-deployment fixes
  - kasm-admin-password-fix-job.yaml

# Wave 2: Container patches (applied after Helm deployment)
patches:
  - path: api-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-api-deployment
      namespace: kasm
  - path: manager-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-manager-deployment
      namespace: kasm
  - path: guac-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-guac-deployment
      namespace: kasm
  - path: proxy-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-proxy-deployment
      namespace: kasm
  - path: share-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-share-deployment
      namespace: kasm

# Note: Strategic merge patches removed as they conflict with multiple sources
# The patches above handle container modifications, sync waves handled per resource