apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - persistent-volume.yaml
  - ingress.yaml
  - ingressroute.yaml
  - rbac.yaml
  - onepassword-items.yaml
  - secrets.yaml
  - base/db.yaml
  - kasm-db-init-job.yaml
  - api-init-job.yaml
  - api-direct-fix.yaml
  - db-label-job.yaml
  - kasm-db-user-setup-job.yaml
  - kasm-db-permissions-job.yaml
  - kasm-db-complete-init-job.yaml
  - kasm-secrets-sync-job.yaml
  - kasm-admin-password-fix-job.yaml

patches:
  - path: api-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-api-deployment
      namespace: kasm
  - path: manager-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-manager-deployment
      namespace: kasm
  - path: guac-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-guac-deployment
      namespace: kasm
  - path: proxy-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-proxy-deployment
      namespace: kasm
  - path: share-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-share-deployment
      namespace: kasm