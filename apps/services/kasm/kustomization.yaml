apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - persistent-volume.yaml
  - ingress.yaml
  - ingressroute.yaml
  - rbac.yaml
  - onepassword-items.yaml
  - secrets.yaml
  - db-configmap.yaml
  - db-cert.yaml
  - db-data-sql-configmap.yaml
  - db-direct-init.yaml
  - api-init-job.yaml
  - api-direct-fix.yaml

patches:
  - path: db-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: kasm-db-statefulset
      namespace: kasm
  - path: api-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-api-deployment
      namespace: kasm
  - path: manager-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-manager-deployment
      namespace: kasm
  - path: guac-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-guac-deployment
      namespace: kasm
  - path: proxy-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-proxy-deployment
      namespace: kasm
  - path: share-container-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kasm-share-deployment
      namespace: kasm