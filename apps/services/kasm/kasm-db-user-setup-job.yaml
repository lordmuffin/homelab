apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-db-user-setup-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-hook: PostSync
    argocd.argoproj.io/sync-hook-weight: "10"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: kasm-secret-sync-v2
      restartPolicy: OnFailure
      containers:
      - name: db-user-setup
        image: postgres:15-alpine
        env:
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-database-postgres-creds
              key: admin-password
        - name: KASM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kasm-database-postgres-creds
              key: db-password
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Starting database user setup automation..."
          
          # Wait for database to be ready
          echo "Waiting for database pod to be ready..."
          while ! kubectl get pod kasm-database-1 -n kasm --field-selector=status.phase=Running >/dev/null 2>&1; do
            echo "Waiting for database pod..."
            sleep 10
          done
          
          # Wait for database service to have endpoints
          echo "Waiting for database service endpoints..."
          while [ -z "$(kubectl get endpoints db -n kasm -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null)" ]; do
            echo "Waiting for database service endpoints..."
            sleep 10
          done
          
          echo "Database is ready, proceeding with user setup..."
          
          # Ensure kasm user has correct password (standardizing on kasm user only)
          echo "Updating kasm user password..."
          kubectl exec -i kasm-database-1 -n kasm -- env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql -U postgres -c "
            ALTER USER kasm WITH PASSWORD '$KASM_DB_PASSWORD';
            GRANT ALL PRIVILEGES ON DATABASE kasm TO kasm;
          " || echo "User update failed, retrying..."
          
          # Verify user configuration
          echo "Verifying kasm user configuration..."
          kubectl exec -i kasm-database-1 -n kasm -- env PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql -U postgres -c "
            SELECT usename, usecreatedb, usesuper FROM pg_user WHERE usename = 'kasm';
          "
          
          echo "Database user setup completed successfully"
      - name: kubectl
        image: bitnami/kubectl:latest
        command: ["/bin/sleep", "infinity"]