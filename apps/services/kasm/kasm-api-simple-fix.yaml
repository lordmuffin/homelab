apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-api-env-fix-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: "10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: kasm-api-fix
        component: environment-fix
    spec:
      serviceAccountName: kasm-secret-sync
      restartPolicy: OnFailure
      containers:
      - name: api-env-fixer
        image: bitnami/kubectl:latest
        env:
        - name: NAMESPACE
          value: "kasm"
        - name: DEPLOYMENT_NAME
          value: "kasm-api-deployment"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== KASM API Environment Fix ==="
          
          # Wait for deployment to exist
          timeout 120 bash -c 'until kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE >/dev/null 2>&1; do echo "Waiting for deployment..."; sleep 5; done'
          
          # Scale down deployment first
          echo "Scaling down deployment..."
          kubectl scale deployment $DEPLOYMENT_NAME -n $NAMESPACE --replicas=0
          
          # Wait for pods to terminate
          sleep 10
          
          # Create a patch to add essential environment variables
          cat > /tmp/env-patch.yaml << 'EOF'
          spec:
            template:
              spec:
                containers:
                - name: kasm-api-container
                  env:
                  - name: LOG_LEVEL
                    value: "INFO"
                  - name: PYTHONPATH
                    value: "/opt/kasm/current"
                  - name: LOGGING_LEVEL
                    value: "INFO"
                  - name: DEBUG
                    value: "false"
                  - name: FORCE_STDOUT_LOGGING
                    value: "true"
                  - name: DISABLE_FILE_LOGGING
                    value: "true"
                  - name: GUNICORN_WORKERS
                    value: "2"
                  - name: GUNICORN_TIMEOUT
                    value: "120"
                  - name: SERVER_HOSTNAME
                    value: "kasm.lab.apj.dev"
          EOF
          
          # Apply the environment patch
          echo "Applying environment patch..."
          kubectl patch deployment $DEPLOYMENT_NAME -n $NAMESPACE --patch-file /tmp/env-patch.yaml
          
          # Scale back up
          echo "Scaling up deployment..."
          kubectl scale deployment $DEPLOYMENT_NAME -n $NAMESPACE --replicas=1
          
          # Wait for rollout
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE --timeout=300s
          
          echo "✅ API deployment environment fix completed!"
          
          # Verify pod is running
          sleep 15
          POD_STATUS=$(kubectl get pods -l app.kubernetes.io/name=kasm-api -n $NAMESPACE -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound")
          echo "Pod status: $POD_STATUS"
          
          if [ "$POD_STATUS" = "Running" ]; then
            echo "🎉 API pod is now running successfully!"
          else
            echo "⚠️  API pod status: $POD_STATUS - may need more time to start"
          fi