apiVersion: v1
kind: Secret
metadata:
  name: kasm-database-postgres-creds
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/managed: "true"
type: Opaque
stringData:
  # Map all fields from kasm-db-postgres-creds to fix secret name mismatch
  # This creates a static alias that ArgoCD can manage
  admin-password: ""  # Will be populated by sync job
  db-password: ""     # Will be populated by sync job
  encryption-secret: ""  # Will be populated by sync job
  manager-token: ""   # Will be populated by sync job
  redis-password: ""  # Will be populated by sync job
  service-token: ""   # Will be populated by sync job
  user-password: ""   # Will be populated by sync job
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-secret-alias-sync-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: kasm-secret-sync
        component: alias-creation
    spec:
      serviceAccountName: kasm-secret-sync
      restartPolicy: OnFailure
      containers:
      - name: secret-alias-creator
        image: bitnami/kubectl:latest
        env:
        - name: NAMESPACE
          value: "kasm"
        - name: SOURCE_SECRET
          value: "kasm-db-postgres-creds"
        - name: TARGET_SECRET
          value: "kasm-database-postgres-creds"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== KASM Secret Alias Creation v2 ==="
          echo "Source: $SOURCE_SECRET -> Target: $TARGET_SECRET"
          
          # Wait for source secret to exist
          echo "Waiting for source secret..."
          timeout 120 bash -c 'until kubectl get secret $SOURCE_SECRET -n $NAMESPACE >/dev/null 2>&1; do echo "Waiting for $SOURCE_SECRET..."; sleep 5; done'
          
          # Verify source secret has all required fields
          echo "Verifying source secret fields..."
          REQUIRED_FIELDS="admin-password db-password encryption-secret manager-token redis-password service-token user-password"
          for field in $REQUIRED_FIELDS; do
            if ! kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath="{.data.$field}" | base64 -d > /dev/null 2>&1; then
              echo "ERROR: Field $field missing or empty in $SOURCE_SECRET"
              exit 1
            fi
            echo "✓ Field $field verified"
          done
          
          # Create target secret with all fields
          echo "Creating target secret with complete field mapping..."
          kubectl create secret generic $TARGET_SECRET -n $NAMESPACE \
            --from-literal=admin-password="$(kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath='{.data.admin-password}' | base64 -d)" \
            --from-literal=db-password="$(kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath='{.data.db-password}' | base64 -d)" \
            --from-literal=encryption-secret="$(kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath='{.data.encryption-secret}' | base64 -d)" \
            --from-literal=manager-token="$(kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath='{.data.manager-token}' | base64 -d)" \
            --from-literal=redis-password="$(kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath='{.data.redis-password}' | base64 -d)" \
            --from-literal=service-token="$(kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath='{.data.service-token}' | base64 -d)" \
            --from-literal=user-password="$(kubectl get secret $SOURCE_SECRET -n $NAMESPACE -o jsonpath='{.data.user-password}' | base64 -d)" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Verify target secret creation
          echo "Verifying target secret creation..."
          kubectl get secret $TARGET_SECRET -n $NAMESPACE -o jsonpath='{.data}' | jq -r 'keys[]' | while read key; do
            echo "✓ Target secret has field: $key"
          done
          
          echo "✅ Secret alias creation completed successfully!"