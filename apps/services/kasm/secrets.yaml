apiVersion: v1
kind: Secret
metadata:
  name: kasm-secrets
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  # Keys with kebab-case naming style for the containers
  admin-password: '{{ op://HomeLab/kasm-admin-creds-1password/password }}'
  db-password: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  redis-password: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  encryption-secret: '{{ op://HomeLab/kasm-encryption-key-1password/password }}'
  manager-token: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  service-token: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  user-password: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  # Keys with camelCase naming style for the Helm chart
  adminPassword: '{{ op://HomeLab/kasm-admin-creds-1password/password }}'
  dbPassword: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  redisPassword: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  encryptionSecret: '{{ op://HomeLab/kasm-encryption-key-1password/password }}'
  managerToken: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  serviceToken: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'
  userPassword: '{{ op://HomeLab/kasm-db-postgres-creds-1password/password }}'