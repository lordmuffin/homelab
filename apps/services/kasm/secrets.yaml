apiVersion: v1
kind: Secret
metadata:
  name: kasm-secrets
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    argocd.argoproj.io/sync-wave: "2"  # Increased wave to run after the all-in-one-secrets is created
type: Opaque
data:
  # This directly references the data from kasm-all-in-one-secrets
  # The db-password will be used by the StatefulSet
  db-password: ${KASM_DB_PASSWORD}

---
# Script ConfigMap to help with sync hooks
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-secret-sync-script
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PreSync
data:
  sync-secrets.sh: |
    #!/bin/bash
    # Get the DB password from the all-in-one-secrets
    DB_PASSWORD=$(kubectl get secret kasm-all-in-one-secrets -n kasm -o jsonpath='{.data.db-password}')
    
    # Replace the placeholder in the YAML template
    cat /tmp/secrets-template.yaml | sed "s/\${KASM_DB_PASSWORD}/$DB_PASSWORD/g" | kubectl apply -f -
    
    echo "Secrets synchronized successfully"

---
# Job to run the script
apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-secret-sync-job
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: kasm-serviceaccount
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command: ["/bin/bash", "/scripts/sync-secrets.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: templates
          mountPath: /tmp
      restartPolicy: Never
      volumes:
      - name: scripts
        configMap:
          name: kasm-secret-sync-script
          defaultMode: 0755
      - name: templates
        configMap:
          name: kasm-secret-templates
          defaultMode: 0644
  backoffLimit: 3

---
# Template ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-secret-templates
  namespace: kasm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  secrets-template.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: kasm-secrets
      namespace: kasm
    type: Opaque
    data:
      db-password: ${KASM_DB_PASSWORD}