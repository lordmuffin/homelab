---
# High Performance NVMe SSD Storage
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvme
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    description: "High performance NVMe SSD storage for latency-sensitive workloads"
provisioner: org.democratic-csi.iscsi-nfs
parameters:
  fsType: ext4
  detachedVolumesFromSnapshots: "false"
  detachedVolumesFromVolumes: "false"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
mountOptions:
  - noatime
  - nodiratime

---
# Standard SATA SSD Storage (Default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sata
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    description: "Standard SATA SSD storage for general workloads"
provisioner: org.democratic-csi.iscsi-nfs
