---
# ServiceMonitor for Services Namespace
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: services-monitoring
  namespace: monitoring
  labels:
    app: services-monitoring
spec:
  selector:
    matchLabels:
      monitoring: "true"
  namespaceSelector:
    matchNames:
    - services
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics