apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: redis-operator
  namespace: redis-operator
  includeCRDs: true
  valuesInline:
    redisOperator:
      name: redis-operator
      imageName: quay.io/opstree/redis-operator
      imageTag: v0.20.2
      imagePullPolicy: IfNotPresent
      webhook: true
    resources:
      limits:
        cpu: 300m
        memory: 600Mi
      requests:
        cpu: 100m
        memory: 200Mi
    replicas: 1
    serviceAccountName: redis-operator
    tolerateAllTaints: false
    service:
      name: webhook-service
      namespace: redis-operator
    certificate:
      name: serving-cert
      secretName: webhook-server-cert

    issuer:
      # Whether to create the issuer or not. You might want to disable this if instead you
      # want to use a ClusterIssuer that you simply want to provide.
      create: true
      # You can choose Issuer or ClusterIssuer here. The first one is namespaced, the second one
      # is available for global usage.
      kind: Issuer
      type: selfSigned
      name: redis-operator-issuer
      email: dorkmeisterx69@gmail.com
      server: https://acme-v02.api.letsencrypt.org/directory
      privateKeySecretName: letsencrypt-prod
      solver:
        enabled: true
        ingressClass: traefik

    certmanager:
      # Whether to use cert-manager for certificate management
      # Only effective when webhook=true
      # If webhook=true and certmanager.enabled=false, you need to manually create certificate secret
      enabled: false
      # API version of the cert-manager CRDs
      apiVersion: "cert-manager.io/v1"
  releaseName: redis-operator
  version: 0.20.2
  repo: https://ot-container-kit.github.io/helm-charts


patches:
 - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: redis.redis.redis.opstreelabs.in
   path: redis-patch.yaml
 - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: redisclusters.redis.redis.opstreelabs.in
   path: redis-patch.yaml
 - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: redisreplications.redis.redis.opstreelabs.in
   path: redis-patch.yaml
 - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: redissentinels.redis.redis.opstreelabs.in
   path: redis-patch.yaml
