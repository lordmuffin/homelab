apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-data-pvc
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sata # Or 'ssd' or your preferred storage class
  resources:
    requests:
      storage: 5Gi # Adjust as needed for logs, db, and cache