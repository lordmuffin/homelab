apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: couchdb
  namespace: couchdb
  includeCRDs: true
  valuesInline:
    # Cluster configuration
    clusterSize: 3
    
    # Security settings - disable admin party for security
    allowAdminParty: false
    
    # Use existing secret for admin credentials
    createAdminSecret: false
    
    # Admin credentials will come from 1Password secret
    adminUsername: admin
    # adminPassword will be provided by the secret
    
    # CouchDB configuration
    couchdbConfig:
      chttpd:
        bind_address: any
        require_valid_user: false
    
    # Persistence configuration
    persistentVolume:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      storageClass: "ssd"  # Use SSD storage class like other apps
    
    # Resource limits
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    
    # Service configuration
    service:
      enabled: true
      type: ClusterIP
      externalPort: 5984
    
    # Enable search capabilities
    enableSearch: false  # Keep disabled unless needed
    
    # Enable network policy for security
    networkPolicy:
      enabled: true
    
    # Service account
    serviceAccount:
      enabled: true
      create: true
    
  releaseName: couchdb
  version: 4.5.3
  repo: https://couchdb.github.io/helm

resources:
- secret.yaml
