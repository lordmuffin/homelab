# Azure DevOps Pipeline: Terraform Plan
# Validates Terraform configurations and generates plans for review

jobs:
- job: TerraformPlanMatrix
  displayName: 'Terraform Plan'
  timeoutInMinutes: 30
  cancelTimeoutInMinutes: 5
  
  strategy:
    matrix:
      DevLab_Main:
        Environment: 'dev-lab'
        Module: 'main'
      DevLab_Vault:
        Environment: 'dev-lab'
        Module: 'vault'
      DevLab_Unifi:
        Environment: 'dev-lab'
        Module: 'unifi'
      DevLab_Vultr:
        Environment: 'dev-lab'
        Module: 'vultr'
      ProdLab_Main:
        Environment: 'prod-lab'
        Module: 'main'
      ProdLab_Vault:
        Environment: 'prod-lab'
        Module: 'vault'
      ProdLab_Unifi:
        Environment: 'prod-lab'
        Module: 'unifi'
      ProdLab_Vultr:
        Environment: 'prod-lab'
        Module: 'vultr'
      ProdLab_B2:
        Environment: 'prod-lab'
        Module: 'b2'
    maxParallel: 5
  
  pool:
    vmImage: 'ubuntu-latest'
  
  variables:
  - group: terraform-$(Environment)
  - name: TF_VERSION
    value: '1.5.7'
  - name: WorkingDirectory
    value: $[eq(variables['Module'], 'main'), 'terraform', format('terraform/modules/{0}', variables['Module'])]
  - name: StateKey
    value: '$(Environment)/$(Module).tfstate'
  
  steps:
  - template: ../templates/terraform-setup.yml
    parameters:
      azureServiceConnection: 'azure-terraform-backend'
      terraformVersion: $(TF_VERSION)
      workingDirectory: $(WorkingDirectory)
      environment: $(Environment)
      module: $(Module)
      stateKey: $(StateKey)
  
  - task: PowerShell@2
    displayName: 'Set Working Directory Variable'
    inputs:
      targetType: 'inline'
      script: |
        if ("$(Module)" -eq "main") {
          $workingDir = "terraform"
        } else {
          $workingDir = "terraform/modules/$(Module)"
        }
        Write-Host "##vso[task.setvariable variable=WORKING_DIR]$workingDir"
        Write-Host "Working directory set to: $workingDir"
  
  - task: TerraformCLI@0
    displayName: 'Terraform Format Check'
    inputs:
      command: 'fmt'
      terraformVersion: $(TF_VERSION)
      workingDirectory: $(WORKING_DIR)
      commandOptions: '-check -recursive'
    continueOnError: false
  
  - task: TerraformCLI@0
    displayName: 'Terraform Init'
    inputs:
      command: 'init'
      terraformVersion: $(TF_VERSION)
      workingDirectory: $(WORKING_DIR)
      backendType: 'azurerm'
      backendServiceArm: 'azure-terraform-backend'
      backendAzureRmResourceGroupName: $(AZURE_BACKEND_RESOURCE_GROUP)
      backendAzureRmStorageAccountName: $(AZURE_BACKEND_STORAGE_ACCOUNT)
      backendAzureRmContainerName: $(AZURE_BACKEND_CONTAINER_NAME)
      backendAzureRmKey: $(StateKey)
  
  - task: TerraformCLI@0
    displayName: 'Terraform Validate'
    inputs:
      command: 'validate'
      terraformVersion: $(TF_VERSION)
      workingDirectory: $(WORKING_DIR)
  
  - task: TerraformCLI@0
    displayName: 'Terraform Plan'
    inputs:
      command: 'plan'
      terraformVersion: $(TF_VERSION)
      workingDirectory: $(WORKING_DIR)
      environmentServiceName: 'azure-terraform-backend'
      commandOptions: '-input=false -out=tfplan-$(Environment)-$(Module).out -detailed-exitcode'
    env:
      TF_VAR_api_key: $(RACKSPACE_API_KEY)
      TF_VAR_environment: $(Environment)
    continueOnError: true
    name: 'TerraformPlan'
  
  - task: PowerShell@2
    displayName: 'Generate Plan Output'
    inputs:
      targetType: 'inline'
      workingDirectory: $(WORKING_DIR)
      script: |
        # Generate human-readable plan output
        terraform show -no-color tfplan-$(Environment)-$(Module).out > plan-output.txt
        
        # Set plan exit code for downstream tasks
        $planExitCode = $env:TERRAFORMCLI_COMMAND_EXIT_CODE
        Write-Host "##vso[task.setvariable variable=PLAN_EXIT_CODE]$planExitCode"
        Write-Host "Plan exit code: $planExitCode"
        
        # Display plan summary
        switch ($planExitCode) {
          "0" { 
            Write-Host "✅ No changes detected"
            Write-Host "##vso[task.setvariable variable=PLAN_STATUS]No Changes"
          }
          "1" { 
            Write-Host "❌ Terraform plan failed"
            Write-Host "##vso[task.setvariable variable=PLAN_STATUS]Failed"
          }
          "2" { 
            Write-Host "📋 Changes detected in plan"
            Write-Host "##vso[task.setvariable variable=PLAN_STATUS]Changes Detected"
          }
          default { 
            Write-Host "❓ Unknown plan exit code: $planExitCode"
            Write-Host "##vso[task.setvariable variable=PLAN_STATUS]Unknown"
          }
        }
  
  - task: PublishPipelineArtifact@1
    displayName: 'Upload Plan Artifacts'
    inputs:
      targetPath: '$(WORKING_DIR)'
      artifactName: 'terraform-plan-$(Environment)-$(Module)'
      publishLocation: 'pipeline'
    condition: always()
  
  - task: PowerShell@2
    displayName: 'Security Scan with tfsec'
    inputs:
      targetType: 'inline'
      workingDirectory: $(WORKING_DIR)
      script: |
        # Install tfsec
        Write-Host "Installing tfsec..."
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
        
        # Run security scan
        Write-Host "🔍 Running Terraform security scan..."
        ./tfsec . --format json --out tfsec-results.json --soft-fail
        
        if (Test-Path "tfsec-results.json") {
          $results = Get-Content "tfsec-results.json" | ConvertFrom-Json
          $highCritical = ($results.results | Where-Object { $_.severity -in @("HIGH", "CRITICAL") }).Count
          
          if ($highCritical -gt 0) {
            Write-Host "⚠️ Security scan found $highCritical HIGH/CRITICAL issues"
            $results.results | Where-Object { $_.severity -in @("HIGH", "CRITICAL") } | ConvertTo-Json -Depth 10
          } else {
            Write-Host "✅ Security scan passed"
          }
        } else {
          Write-Host "ℹ️ No security scan results generated"
        }
    continueOnError: true
  
  - task: PowerShell@2
    displayName: 'Comment on Pull Request'
    inputs:
      targetType: 'inline'
      script: |
        # Only run for pull requests
        if ("$(Build.Reason)" -eq "PullRequest") {
          $planOutput = Get-Content "$(WORKING_DIR)/plan-output.txt" -Raw
          
          # Determine status emoji and text
          $statusEmoji = "✅"
          $statusText = "No changes"
          
          switch ("$(PLAN_EXIT_CODE)") {
            "1" { 
              $statusEmoji = "❌"
              $statusText = "Plan failed"
            }
            "2" { 
              $statusEmoji = "📋"
              $statusText = "Changes detected"
            }
          }
          
          # Truncate plan output if too long
          if ($planOutput.Length -gt 60000) {
            $planOutput = $planOutput.Substring(0, 60000) + "`n`n... (truncated)"
          }
          
          # Create comment body
          $comment = @"
        ## $statusEmoji Terraform Plan: $(Environment)/$(Module)
        
        **Status:** $statusText
        **Environment:** ``$(Environment)``
        **Module:** ``$(Module)``
        **Commit:** $(Build.SourceVersion.Substring(0, 7))
        
        <details>
        <summary>📋 Plan Output</summary>
        
        ``````terraform
        $planOutput
        ``````
        
        </details>
        
        ---
        *Plan generated at $(Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")*
        "@
          
          # Post comment to PR
          $headers = @{
            "Authorization" = "Bearer $(System.AccessToken)"
            "Content-Type" = "application/json"
          }
          
          $body = @{
            "content" = $comment
          } | ConvertTo-Json
          
          $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=6.0"
          
          try {
            Invoke-RestMethod -Uri $uri -Method POST -Headers $headers -Body $body
            Write-Host "✅ Comment posted to pull request"
          } catch {
            Write-Host "⚠️ Failed to post comment: $($_.Exception.Message)"
          }
        }
    condition: eq(variables['Build.Reason'], 'PullRequest')
    continueOnError: true
  
  - task: PowerShell@2
    displayName: 'Plan Status Check'
    inputs:
      targetType: 'inline'
      script: |
        switch ("$(PLAN_EXIT_CODE)") {
          "0" { 
            Write-Host "✅ No changes detected"
            exit 0
          }
          "1" { 
            Write-Host "❌ Terraform plan failed"
            exit 1
          }
          "2" { 
            Write-Host "📋 Changes detected in plan"
            exit 0
          }
          default { 
            Write-Host "❓ Unknown plan exit code: $(PLAN_EXIT_CODE)"
            exit 1
          }
        }