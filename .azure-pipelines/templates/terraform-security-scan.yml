# Azure DevOps Template: Terraform Security Scan
# Shared template for running security scans on Terraform configurations

parameters:
  - name: workingDirectory
    type: string
    displayName: 'Working Directory'
    default: 'terraform'
  
  - name: scanLevel
    type: string
    displayName: 'Security Scan Level'
    default: 'standard'
    values:
      - basic
      - standard
      - comprehensive
  
  - name: failOnHighSeverity
    type: boolean
    displayName: 'Fail on High Severity Issues'
    default: false
  
  - name: failOnCriticalSeverity
    type: boolean
    displayName: 'Fail on Critical Severity Issues'
    default: true

steps:
  - task: PowerShell@2
    displayName: 'Install Security Scanning Tools'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "🔧 Installing security scanning tools..."
        
        # Install tfsec
        Write-Host "Installing tfsec..."
        $tfsecUrl = "https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64"
        Invoke-WebRequest -Uri $tfsecUrl -OutFile "/usr/local/bin/tfsec"
        chmod +x /usr/local/bin/tfsec
        
        # Install checkov if comprehensive scan requested
        if ("${{ parameters.scanLevel }}" -eq "comprehensive") {
          Write-Host "Installing checkov..."
          pip3 install checkov
        }
        
        # Install terrascan if comprehensive scan requested
        if ("${{ parameters.scanLevel }}" -eq "comprehensive") {
          Write-Host "Installing terrascan..."
          $terrascanUrl = "https://github.com/tenable/terrascan/releases/latest/download/terrascan_1.18.3_Linux_x86_64.tar.gz"
          curl -L $terrascanUrl | tar -xz -C /usr/local/bin terrascan
        }
        
        Write-Host "✅ Security scanning tools installed"

  - task: PowerShell@2
    displayName: 'Run tfsec Security Scan'
    inputs:
      targetType: 'inline'
      workingDirectory: '${{ parameters.workingDirectory }}'
      script: |
        Write-Host "🔍 Running tfsec security scan..."
        
        # Run tfsec with JSON output
        tfsec . --format json --out tfsec-results.json --soft-fail
        
        if (Test-Path "tfsec-results.json") {
          $results = Get-Content "tfsec-results.json" | ConvertFrom-Json
          
          # Count issues by severity
          $critical = ($results.results | Where-Object { $_.severity -eq "CRITICAL" }).Count
          $high = ($results.results | Where-Object { $_.severity -eq "HIGH" }).Count
          $medium = ($results.results | Where-Object { $_.severity -eq "MEDIUM" }).Count
          $low = ($results.results | Where-Object { $_.severity -eq "LOW" }).Count
          
          Write-Host "📊 tfsec Results:"
          Write-Host "  Critical: $critical"
          Write-Host "  High: $high"
          Write-Host "  Medium: $medium"
          Write-Host "  Low: $low"
          
          # Set variables for later use
          Write-Host "##vso[task.setvariable variable=TFSEC_CRITICAL]$critical"
          Write-Host "##vso[task.setvariable variable=TFSEC_HIGH]$high"
          Write-Host "##vso[task.setvariable variable=TFSEC_MEDIUM]$medium"
          Write-Host "##vso[task.setvariable variable=TFSEC_LOW]$low"
          
          # Display high and critical issues
          if ($critical -gt 0 -or $high -gt 0) {
            Write-Host "⚠️ High/Critical severity issues found:"
            $results.results | Where-Object { $_.severity -in @("HIGH", "CRITICAL") } | ForEach-Object {
              Write-Host "  - [$($_.severity)] $($_.description) ($($_.rule_id))"
              Write-Host "    File: $($_.location.filename):$($_.location.start_line)"
            }
          } else {
            Write-Host "✅ No high or critical severity issues found"
          }
        } else {
          Write-Host "⚠️ No tfsec results generated"
          Write-Host "##vso[task.setvariable variable=TFSEC_CRITICAL]0"
          Write-Host "##vso[task.setvariable variable=TFSEC_HIGH]0"
          Write-Host "##vso[task.setvariable variable=TFSEC_MEDIUM]0"
          Write-Host "##vso[task.setvariable variable=TFSEC_LOW]0"
        }

  - task: PowerShell@2
    displayName: 'Run Checkov Security Scan'
    condition: eq('${{ parameters.scanLevel }}', 'comprehensive')
    inputs:
      targetType: 'inline'
      workingDirectory: '${{ parameters.workingDirectory }}'
      script: |
        Write-Host "🔍 Running Checkov security scan..."
        
        # Run checkov with JSON output
        checkov -d . --framework terraform --output json --output-file checkov-results.json --soft-fail
        
        if (Test-Path "checkov-results.json") {
          $results = Get-Content "checkov-results.json" | ConvertFrom-Json
          
          $failed = $results.summary.failed
          $passed = $results.summary.passed
          $skipped = $results.summary.skipped
          
          Write-Host "📊 Checkov Results:"
          Write-Host "  Failed: $failed"
          Write-Host "  Passed: $passed"
          Write-Host "  Skipped: $skipped"
          
          Write-Host "##vso[task.setvariable variable=CHECKOV_FAILED]$failed"
          Write-Host "##vso[task.setvariable variable=CHECKOV_PASSED]$passed"
          
          if ($failed -gt 0) {
            Write-Host "⚠️ Checkov found $failed failed checks"
          } else {
            Write-Host "✅ All Checkov checks passed"
          }
        } else {
          Write-Host "⚠️ No Checkov results generated"
          Write-Host "##vso[task.setvariable variable=CHECKOV_FAILED]0"
          Write-Host "##vso[task.setvariable variable=CHECKOV_PASSED]0"
        }

  - task: PowerShell@2
    displayName: 'Run Terrascan Security Scan'
    condition: eq('${{ parameters.scanLevel }}', 'comprehensive')
    inputs:
      targetType: 'inline'
      workingDirectory: '${{ parameters.workingDirectory }}'
      script: |
        Write-Host "🔍 Running Terrascan security scan..."
        
        # Run terrascan with JSON output
        terrascan scan -t terraform -o json --output-file terrascan-results.json
        
        if (Test-Path "terrascan-results.json") {
          $results = Get-Content "terrascan-results.json" | ConvertFrom-Json
          
          $violations = $results.results.violations.Count
          
          Write-Host "📊 Terrascan Results:"
          Write-Host "  Violations: $violations"
          
          Write-Host "##vso[task.setvariable variable=TERRASCAN_VIOLATIONS]$violations"
          
          if ($violations -gt 0) {
            Write-Host "⚠️ Terrascan found $violations violations"
          } else {
            Write-Host "✅ No Terrascan violations found"
          }
        } else {
          Write-Host "⚠️ No Terrascan results generated"
          Write-Host "##vso[task.setvariable variable=TERRASCAN_VIOLATIONS]0"
        }

  - task: PowerShell@2
    displayName: 'Generate Security Report'
    inputs:
      targetType: 'inline'
      workingDirectory: '${{ parameters.workingDirectory }}'
      script: |
        Write-Host "📋 Generating security scan report..."
        
        $report = @"
        # Terraform Security Scan Report
        
        **Scan Level:** ${{ parameters.scanLevel }}
        **Timestamp:** $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
        **Working Directory:** ${{ parameters.workingDirectory }}
        
        ## tfsec Results
        
        | Severity | Count |
        |----------|-------|
        | Critical | $(TFSEC_CRITICAL) |
        | High     | $(TFSEC_HIGH) |
        | Medium   | $(TFSEC_MEDIUM) |
        | Low      | $(TFSEC_LOW) |
        
        "@
        
        if ("${{ parameters.scanLevel }}" -eq "comprehensive") {
          $report += @"
        
        ## Checkov Results
        
        | Status | Count |
        |--------|-------|
        | Failed | $(CHECKOV_FAILED) |
        | Passed | $(CHECKOV_PASSED) |
        
        ## Terrascan Results
        
        | Type | Count |
        |------|-------|
        | Violations | $(TERRASCAN_VIOLATIONS) |
        
        "@
        }
        
        Set-Content -Path "security-report.md" -Value $report
        Write-Host "✅ Security report generated"

  - task: PublishPipelineArtifact@1
    displayName: 'Upload Security Scan Results'
    inputs:
      targetPath: '${{ parameters.workingDirectory }}'
      artifactName: 'security-scan-results-$(System.JobId)'
      publishLocation: 'pipeline'

  - task: PowerShell@2
    displayName: 'Evaluate Security Scan Results'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "🔍 Evaluating security scan results..."
        
        $criticalCount = [int]"$(TFSEC_CRITICAL)"
        $highCount = [int]"$(TFSEC_HIGH)"
        
        $shouldFail = $false
        $failureReasons = @()
        
        # Check critical severity threshold
        if ("${{ parameters.failOnCriticalSeverity }}" -eq "True" -and $criticalCount -gt 0) {
          $shouldFail = $true
          $failureReasons += "Found $criticalCount critical severity issues"
        }
        
        # Check high severity threshold
        if ("${{ parameters.failOnHighSeverity }}" -eq "True" -and $highCount -gt 0) {
          $shouldFail = $true
          $failureReasons += "Found $highCount high severity issues"
        }
        
        # Additional checks for comprehensive scans
        if ("${{ parameters.scanLevel }}" -eq "comprehensive") {
          $checkovFailed = [int]"$(CHECKOV_FAILED)"
          $terrascanViolations = [int]"$(TERRASCAN_VIOLATIONS)"
          
          if ($checkovFailed -gt 10) {  # Threshold for Checkov failures
            $shouldFail = $true
            $failureReasons += "Checkov failed checks exceed threshold: $checkovFailed"
          }
          
          if ($terrascanViolations -gt 5) {  # Threshold for Terrascan violations
            $shouldFail = $true
            $failureReasons += "Terrascan violations exceed threshold: $terrascanViolations"
          }
        }
        
        if ($shouldFail) {
          Write-Host "❌ Security scan failed:"
          $failureReasons | ForEach-Object { Write-Host "  - $_" }
          exit 1
        } else {
          Write-Host "✅ Security scan passed all configured thresholds"
        }