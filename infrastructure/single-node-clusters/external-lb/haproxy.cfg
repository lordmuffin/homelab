#---------------------------------------------------------------------
# HAProxy Configuration for Single-Node Kubernetes Clusters
# External Load Balancer for Homelab Multi-Cluster Architecture
#---------------------------------------------------------------------

global
    log 127.0.0.1:514 local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    
    # SSL/TLS Configuration
    ssl-default-bind-ciphers ECDHE+aes128gcm:ECDHE+aes256gcm:ECDHE+aes128sha256:ECDHE+aes256sha384:ECDHE+sha256:ECDHE+sha1:RSA+aes128gcm:RSA+aes256gcm:RSA+aes128sha256:RSA+aes256sha384:RSA+sha256:RSA+sha1
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    ssl-default-server-ciphers ECDHE+aes128gcm:ECDHE+aes256gcm:ECDHE+aes128sha256:ECDHE+aes256sha384:ECDHE+sha256:ECDHE+sha1:RSA+aes128gcm:RSA+aes256gcm:RSA+aes128sha256:RSA+aes256sha384:RSA+sha256:RSA+sha1
    ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor except 127.0.0.0/8
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 10s
    timeout check 5s
    maxconn 3000

#---------------------------------------------------------------------
# Frontend Configuration - Main Entry Points
#---------------------------------------------------------------------

# HTTP Frontend (redirect to HTTPS)
frontend http_frontend
    bind *:80
    bind 10.0.1.100:80  # Virtual IP
    redirect scheme https code 301

# HTTPS Frontend - Main SSL Termination
frontend https_frontend
    bind *:443 ssl crt /etc/ssl/certs/homelab/
    bind 10.0.1.100:443 ssl crt /etc/ssl/certs/homelab/  # Virtual IP
    
    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    
    # Service routing based on hostname
    use_backend argocd_cluster if { hdr(host) -i argocd.homelab.local }
    use_backend monitoring_cluster if { hdr(host) -i grafana.homelab.local }
    use_backend monitoring_cluster if { hdr(host) -i prometheus.homelab.local }
    use_backend media_cluster if { hdr(host) -i jellyfin.homelab.local }
    use_backend media_cluster if { hdr(host) -i sonarr.homelab.local }
    use_backend media_cluster if { hdr(host) -i radarr.homelab.local }
    use_backend media_cluster if { hdr(host) -i prowlarr.homelab.local }
    use_backend ai_cluster if { hdr(host) -i localai.homelab.local }
    use_backend ai_cluster if { hdr(host) -i qdrant.homelab.local }
    use_backend general_cluster if { hdr(host) -i homeassistant.homelab.local }
    
    # Default backend for unmapped services
    default_backend general_cluster

# Stats Frontend
frontend stats_frontend
    bind *:8404
    bind 10.0.1.100:8404  # Virtual IP
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

#---------------------------------------------------------------------
# Backend Configuration - Kubernetes Cluster Endpoints
#---------------------------------------------------------------------

# ArgoCD Cluster (Critical Infrastructure)
backend argocd_cluster
    balance roundrobin
    option httpchk GET /healthz HTTP/1.1\r\nHost:\ argocd.homelab.local
    http-check expect status 200
    
    server node1-compute 10.0.1.101:443 check ssl verify none maxconn 100
    server node2-storage 10.0.1.102:443 check ssl verify none maxconn 100 backup
    server node3-general 10.0.1.103:443 check ssl verify none maxconn 100 backup

# AI/ML Compute Cluster (High Performance)
backend ai_cluster
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ localai.homelab.local
    http-check expect status 200-399
    
    # Primary: High-performance compute node
    server node1-compute 10.0.1.101:443 check ssl verify none maxconn 200 weight 100
    # Backup: Other nodes for failover
    server node3-general 10.0.1.103:443 check ssl verify none maxconn 50 backup

# Media Cluster (Storage Intensive)
backend media_cluster
    balance roundrobin
    option httpchk GET /health HTTP/1.1
    http-check expect status 200-399
    
    # Primary: Storage-optimized node
    server node2-storage 10.0.1.102:443 check ssl verify none maxconn 150 weight 100
    # Backup: General node for failover
    server node3-general 10.0.1.103:443 check ssl verify none maxconn 75 backup

# Monitoring Cluster (Distributed)
backend monitoring_cluster
    balance roundrobin
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ grafana.homelab.local
    http-check expect status 200
    
    server node1-compute 10.0.1.101:443 check ssl verify none maxconn 100
    server node2-storage 10.0.1.102:443 check ssl verify none maxconn 100
    server node3-general 10.0.1.103:443 check ssl verify none maxconn 100

# General Purpose Cluster (Default)
backend general_cluster
    balance roundrobin
    option httpchk GET /healthz HTTP/1.1
    http-check expect status 200-399
    
    server node3-general 10.0.1.103:443 check ssl verify none maxconn 200 weight 100
    server node1-compute 10.0.1.101:443 check ssl verify none maxconn 100 backup
    server node2-storage 10.0.1.102:443 check ssl verify none maxconn 100 backup

#---------------------------------------------------------------------
# API Server Load Balancing (Kubernetes API)
#---------------------------------------------------------------------

# Kubernetes API Frontend
frontend k8s_api_frontend
    bind *:6443
    bind 10.0.1.100:6443  # Virtual IP
    mode tcp
    
    # Use different backends based on client IP or other criteria
    default_backend k8s_api_cluster

# Kubernetes API Backend
backend k8s_api_cluster
    mode tcp
    balance roundrobin
    option tcp-check
    
    # Health checks for Kubernetes API servers
    tcp-check connect port 6443
    tcp-check send-binary 474554202f617069 # GET /api
    tcp-check expect binary 485454502f312e31 # HTTP/1.1
    
    server node1-api 10.0.1.101:6443 check maxconn 100
    server node2-api 10.0.1.102:6443 check maxconn 100
    server node3-api 10.0.1.103:6443 check maxconn 100

#---------------------------------------------------------------------
# Health Check and Logging Configuration
#---------------------------------------------------------------------

# Custom error pages
errorfile 400 /etc/haproxy/errors/400.http
errorfile 403 /etc/haproxy/errors/403.http
errorfile 408 /etc/haproxy/errors/408.http
errorfile 500 /etc/haproxy/errors/500.http
errorfile 502 /etc/haproxy/errors/502.http
errorfile 503 /etc/haproxy/errors/503.http
errorfile 504 /etc/haproxy/errors/504.http