# Keepalived Configuration for HAProxy High Availability
# Provides Virtual IP (VIP) failover for external load balancer

global_defs {
    notification_email {
        admin@homelab.local
    }
    notification_email_from keepalived@homelab.local
    smtp_server localhost
    smtp_connect_timeout 30
    router_id HOMELAB_LB
    script_user root
    enable_script_security
}

# Health check script for HAProxy
vrrp_script chk_haproxy {
    script "/usr/local/bin/check_haproxy.sh"
    interval 2
    timeout 3
    fall 2
    rise 3
    weight -10
}

# Health check script for general connectivity
vrrp_script chk_network {
    script "/usr/local/bin/check_network.sh"
    interval 5
    timeout 3
    fall 2
    rise 3
    weight -5
}

# VRRP instance for primary load balancer
vrrp_instance VI_1 {
    state MASTER                    # MASTER on primary, BACKUP on secondary
    interface eth0                  # Network interface (adjust as needed)
    virtual_router_id 51           # Must be same on all nodes
    priority 110                   # Higher on primary (100 on backup)
    advert_int 1
    
    authentication {
        auth_type PASS
        auth_pass homelab_vip_2024   # Change this password
    }
    
    # Virtual IP addresses
    virtual_ipaddress {
        10.0.1.100/24               # Primary VIP for services
        10.0.1.101/24 dev eth0 label eth0:vip1  # Additional VIPs if needed
    }
    
    # Virtual routes (optional)
    virtual_routes {
        0.0.0.0/0 via 10.0.1.1 dev eth0
    }
    
    # Track scripts
    track_script {
        chk_haproxy
        chk_network
    }
    
    # Notify scripts
    notify_master "/usr/local/bin/notify_master.sh"
    notify_backup "/usr/local/bin/notify_backup.sh"
    notify_fault "/usr/local/bin/notify_fault.sh"
    
    # Preempt settings
    preempt_delay 10               # Wait before taking over
    
    # Unicast configuration (if multicast is not available)
    unicast_src_ip 10.0.1.10      # Source IP of this keepalived instance
    unicast_peer {
        10.0.1.11                  # IP of backup keepalived instance
    }
}

# Virtual server for HTTP health checking
virtual_server 10.0.1.100 80 {
    delay_loop 30
    lb_algo rr                     # Round robin
    lb_kind NAT
    persistence_timeout 0
    protocol TCP
    
    real_server 127.0.0.1 80 {
        weight 100
        TCP_CHECK {
            connect_timeout 3
            nb_get_retry 3
            delay_before_retry 3
            connect_port 80
        }
    }
}

