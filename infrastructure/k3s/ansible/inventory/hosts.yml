# Dynamic Inventory Template for K3s HA Cluster
# This template should be populated by Terraform outputs
# Template variables will be replaced during deployment

all:
  children:
    k3s_cluster:
      children:
        masters:
          hosts:
            # Production: 3 masters for HA
            k3s-master-01:
              ansible_host: "${master_1_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: master
              node_taint: "CriticalAddonsOnly=true:NoExecute"
              etcd_member: true
            k3s-master-02:
              ansible_host: "${master_2_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: master
              node_taint: "CriticalAddonsOnly=true:NoExecute"
              etcd_member: true
            k3s-master-03:
              ansible_host: "${master_3_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: master
              node_taint: "CriticalAddonsOnly=true:NoExecute"
              etcd_member: true
          vars:
            k3s_role: master
            
        workers:
          hosts:
            k3s-worker-01:
              ansible_host: "${worker_1_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: worker
              storage_class: "longhorn-ssd-standard"
            k3s-worker-02:
              ansible_host: "${worker_2_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: worker
              storage_class: "longhorn-ssd-standard"
            k3s-worker-03:
              ansible_host: "${worker_3_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: worker
              storage_class: "longhorn-nvme-critical"
            k3s-worker-04:
              ansible_host: "${worker_4_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: worker
              storage_class: "longhorn-nvme-critical"
            k3s-worker-05:
              ansible_host: "${worker_5_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: worker
              storage_class: "longhorn-bulk"
          vars:
            k3s_role: worker
            
        gpu_workers:
          hosts:
            k3s-gpu-01:
              ansible_host: "${gpu_worker_1_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: gpu-worker
              gpu_type: "nvidia"
              storage_class: "longhorn-nvme-critical"
              node_labels:
                - "nvidia.com/gpu=true"
                - "workload.type=ai"
            k3s-gpu-02:
              ansible_host: "${gpu_worker_2_ip}"
              ansible_user: "${ssh_user}"
              ansible_ssh_private_key_file: "${ssh_private_key}"
              node_role: gpu-worker
              gpu_type: "nvidia"
              storage_class: "longhorn-nvme-critical"
              node_labels:
                - "nvidia.com/gpu=true"
                - "workload.type=ai"
          vars:
            k3s_role: gpu-worker

  vars:
    # Global cluster configuration
    cluster_name: "homelab-k3s"
    k3s_version: "v1.28.5+k3s1"
    k3s_download_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    
    # Network configuration
    cluster_cidr: "10.42.0.0/16"
    service_cidr: "10.43.0.0/16"
    cluster_dns: "10.43.0.10"
    
    # Load balancer configuration
    metallb_ip_range: "192.168.11.100-192.168.11.200"
    
    # Storage configuration
    longhorn_enabled: true
    longhorn_namespace: "longhorn-system"
    
    # Monitoring configuration
    prometheus_enabled: true
    grafana_enabled: true
    monitoring_namespace: "monitoring"
    
    # Integration with existing homelab
    existing_domain: "{{ homelab_domain | default('homelab.local') }}"
    traefik_enabled: true
    argocd_enabled: true
    
    # SSH configuration
    ssh_user: "{{ ansible_user | default('ubuntu') }}"
    ssh_private_key: "{{ ssh_key_path | default('~/.ssh/homelab') }}"
    
    # High Availability configuration
    ha_enabled: true
    embedded_etcd: true
    datastore_endpoint: ""  # Use embedded etcd for HA
    
    # Security configuration
    disable_components:
      - traefik  # We'll use our own Traefik setup
      - servicelb  # We'll use MetalLB
    
    # Node configuration
    kubelet_args:
      - "--max-pods=250"
      - "--node-status-update-frequency=5s"
      - "--image-gc-high-threshold=85"
      - "--image-gc-low-threshold=80"
    
    kube_apiserver_args:
      - "--audit-log-maxage=30"
      - "--audit-log-maxbackup=3"
      - "--audit-log-maxsize=100"
      - "--enable-admission-plugins=NodeRestriction,ResourceQuota,LimitRanger"
    
    kube_controller_manager_args:
      - "--bind-address=0.0.0.0"
      - "--node-monitor-period=5s"
      - "--node-monitor-grace-period=40s"
      - "--pod-eviction-timeout=5m"