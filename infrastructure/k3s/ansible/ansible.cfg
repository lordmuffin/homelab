[defaults]
# Disable SSH host key checking for new VMs
host_key_checking = False

# SSH connection settings
timeout = 30
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# Performance settings
gathering = smart
fact_caching = memory
fact_caching_timeout = 3600

# Inventory settings
inventory = inventory/discovered-hosts.yml

# Logging
log_path = ./ansible.log

# Privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[inventory]
# Enable inventory plugins
enable_plugins = host_list, script, auto, yaml, ini, toml

[ssh_connection]
# SSH-specific settings for new VMs
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3
control_path_dir = /tmp/.ansible-cp
control_path = /tmp/.ansible-cp/ansible-ssh-%%h-%%p-%%r
pipelining = True